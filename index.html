<style>
/* ---------- visual system (hairline grid, warm ground, one strong accent) ----------
   Colours live in tokens only. The palettes at the end of this sheet re-point those tokens, so
   nothing below ever names a colour directly. --pink-* is the accent ramp, whatever the accent is. */
:root {
  --bg: #FEFAE0;
  --surface: #FFFDF3;
  --surface-2: #FAEDCD;
  --sage: #CCD5AE;
  --sage-soft: #E9EDC9;
  --sand: #FAEDCD;
  --tan: #D4A373;
  --tan-deep: #9C6B3C;
  --tan-soft: #F1DDC0;
  --pink-1: #FFE5EC;
  --pink-2: #FFC2D1;
  --pink-3: #FFB3C6;
  --pink-4: #FF8FAB;
  --pink-5: #FB6F92;
  --pink-ink: #2F2D1F;
  --ink: #3A2230;
  --ink-2: #6B4A58;
  --ink-3: #9A7F8A;
  --line: #5C2E45;
  --line-soft: #EBD3DA;
  --dot: #5C2E45;
  --shape: #FFB3C6;
  --ok: #5F7A3A;
  --ok-soft: #E9EDC9;
  --bad: #B9553B;
  --bad-soft: #F8DCD0;
  --inverse: #3A2230;
  --inverse-ink: #FFE5EC;
  --inverse-ink-2: #B58FA0;
  --tile-3: #FFB3C6;
  --mascot-outline: rgba(0,0,0,0);
  --radius: 10px;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "DM Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 24px 60px -30px rgba(58, 34, 48, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1519; --surface: #26191F; --surface-2: #2F2026;
    --sage: #3E4A2E; --sage-soft: #2E3626; --sand: #3A2A30;
    --tan: #D4A373; --tan-deep: #E2B98A; --tan-soft: #4A3A26;
    --pink-1: #3E2630; --pink-2: #5C3344; --pink-3: #FFB3C6; --pink-4: #FF8FAB; --pink-5: #FB6F92; --pink-ink: #F7EDF0; --tile-3: #6E3A52; --mascot-outline: #6E4A5C;
    --ink: #F7EDF0; --ink-2: #D2B8C2; --ink-3: #97808A; --line: #F1DCE3; --line-soft: #3F2C35; --dot: #F1DCE3; --shape: #4A2A3A;
    --ok: #A9C57A; --ok-soft: #2E3A22; --bad: #F0866B; --bad-soft: #3E241E;
    --inverse: #F7EDF0; --inverse-ink: #1E1519; --inverse-ink-2: #7A5E6A;
    --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1519; --surface: #26191F; --surface-2: #2F2026;
  --sage: #3E4A2E; --sage-soft: #2E3626; --sand: #3A2A30;
  --tan: #D4A373; --tan-deep: #E2B98A; --tan-soft: #4A3A26;
  --pink-1: #3E2630; --pink-2: #5C3344; --pink-3: #FFB3C6; --pink-4: #FF8FAB; --pink-5: #FB6F92; --pink-ink: #F7EDF0; --tile-3: #6E3A52; --mascot-outline: #6E4A5C;
  --ink: #F7EDF0; --ink-2: #D2B8C2; --ink-3: #97808A; --line: #F1DCE3; --line-soft: #3F2C35; --dot: #F1DCE3; --shape: #4A2A3A;
  --ok: #A9C57A; --ok-soft: #2E3A22; --bad: #F0866B; --bad-soft: #3E241E;
  --inverse: #F7EDF0; --inverse-ink: #1E1519; --inverse-ink-2: #7A5E6A;
  --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800; }
h2 { font-size: clamp(1.5rem, 2.6vw, 2rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, .cell:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--pink-5); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.label { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.es { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.pill.pink { background: var(--pink-2); border-color: transparent; color: var(--pink-ink); }
.pill.sage { background: var(--sage); border-color: transparent; color: #2F2D1F; }
.pill.rose { background: var(--pink-4); border-color: transparent; color: #3A2230; }
.pill.tan { background: var(--tan); border-color: transparent; color: #2F2D1F; }
.pill.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
:root[data-theme="dark"] .pill.sage, :root[data-theme="dark"] .pill.tan { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.sage, :root:not([data-theme="light"]) .pill.tan { color: var(--ink); } }

/* halftone panel */
.halftone { position: relative; overflow: hidden; background-color: var(--surface); }
.halftone::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px); background-size: 8px 8px; opacity: .55; -webkit-mask-image: linear-gradient(135deg, rgba(0,0,0,1) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,0) 85%); mask-image: linear-gradient(135deg, rgba(0,0,0,1) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,0) 85%); pointer-events: none; }
.halftone.soft::before { opacity: .25; }
.halftone .shape { position: absolute; right: -4%; bottom: -26%; font-family: var(--font-display); font-weight: 800; font-size: 20rem; line-height: 1; letter-spacing: -0.06em; color: var(--shape); pointer-events: none; user-select: none; z-index: 0; }
.halftone > :not(.shape) { position: relative; z-index: 1; }

/* topbar */
.topbar { display: grid; grid-template-columns: auto auto 1fr auto auto auto auto; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 20; min-height: 56px; }
.topbar > * { display: flex; align-items: center; padding: 0 16px; border-right: 1px solid var(--line); min-width: 0; }
.topbar > *:last-child { border-right: 0; }
.topbar .wordmark { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.04em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.wordmark .mos { background: var(--pink-4); color: #3A2230; padding: 0 .3em; margin-left: 1px; border-radius: 4px; }
.topbar .lvl { gap: 8px; padding: 0 10px; }
.topbar .lvl select { font: inherit; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 6px 8px; cursor: pointer; }
.topbar .crumb { font-size: .9rem; gap: 10px; color: var(--ink-3); }
.topbar .crumb a { color: var(--ink-2); text-decoration: none; }
.topbar .crumb a:hover { text-decoration: underline; }
.topbar .crumb .sep { color: var(--line-soft); }
.topbar .crumb strong { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .stat { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; gap: 10px; }
.topbar .stat b { color: var(--pink-5); font-weight: 500; }
.topbar .goal { gap: 10px; padding: 0 14px; }
.ring { width: 30px; height: 30px; flex: none; }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--pink-2); }
.ring .fill { stroke: var(--pink-5); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .4s; }
.streak { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.streak b { color: var(--pink-5); font-weight: 500; }
.topbar .theme { padding: 0 10px; }
.topbar .theme button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; border-radius: 999px; color: var(--ink-2); }
.topbar .theme button:hover { color: var(--ink); background: var(--pink-1); }
.topbar .theme .ic { flex: none; }
.topbar .theme .ic-sun { display: none; }
.topbar .theme button.isdark .ic-sun { display: block; }
.topbar .theme button.isdark .ic-moon { display: none; }
.topbar .cta { padding: 0; }
.topbar .cta .btn { height: 100%; border: 0; border-radius: 0; padding: 0 18px; background: var(--pink-4); color: #3A2230; }
.topbar .cta .btn:hover { background: var(--pink-5); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s, border-color .15s, transform .1s; }
.btn:hover { background: var(--pink-1); }
.btn:active { transform: translateY(1px); }
.btn .arr { font-family: var(--font-body); }
.btn.primary { background: var(--pink-5); color: #3A2230; border-color: var(--pink-5); }
.btn.primary:hover { background: var(--inverse); border-color: var(--inverse); color: var(--inverse-ink); }
.btn.pink { background: var(--pink-2); border-color: var(--pink-2); color: var(--pink-ink); }
.btn.pink:hover { background: var(--pink-4); border-color: var(--pink-4); color: #3A2230; }
.btn.rose { background: var(--pink-4); border-color: var(--pink-4); color: #3A2230; }
.btn.rose:hover { background: var(--pink-5); border-color: var(--pink-5); }
.btn.tan { background: var(--tan); border-color: var(--tan); color: #3A2230; }
.btn.tan:hover { background: var(--tan-deep); border-color: var(--tan-deep); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 7px 12px; font-size: .66rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* grid primitives */
.grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.grid > * { background: var(--surface); min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; }
.section { border-bottom: 1px solid var(--line); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 28px 12px; border-bottom: 1px solid var(--line); }
.section-head h2 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack.tight { gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

/* hero */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto auto; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.hero > * { background: var(--surface); min-width: 0; }
.hero .big { padding: 56px 32px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; min-height: 320px; }
.hero .big h1 { font-size: clamp(3.4rem, 9vw, 8.5rem); font-weight: 800; letter-spacing: -0.06em; line-height: .86; }
.hero .big h1 .mos { padding: 0 .1em; display: inline-block; line-height: .95; }
.hero .big .tag { max-width: 42ch; color: var(--ink-2); font-size: 1.05rem; }
.hero .art { min-height: 320px; background-color: var(--pink-2); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
.hero .art .label { color: var(--ink-2); }
.hero .art .big-num { font-family: var(--font-display); font-weight: 800; font-size: 4.2rem; letter-spacing: -0.05em; line-height: 1; }
.hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.hero .split > * { min-width: 0; }
.hero .dark { background: var(--inverse); color: var(--inverse-ink); padding: 28px 28px 22px; display: flex; flex-direction: column; gap: 22px; }
.hero .dark p { font-family: var(--font-display); font-size: clamp(1.1rem, 1.7vw, 1.35rem); font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; }
.hero .dark .btn { margin-top: auto; border-color: var(--inverse-ink-2); background: transparent; color: var(--inverse-ink); }
.hero .dark .btn:hover { background: var(--pink-4); color: #3A2230; border-color: var(--pink-4); }
.hero .pinkbox { background: var(--pink-4); color: #3A2230; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.hero .pinkbox h3 { font-size: 1.6rem; letter-spacing: -0.04em; }
.hero .pinkbox .btn { background: transparent; border-color: #3A2230; color: #3A2230; align-self: flex-start; }
.hero .pinkbox .btn:hover { background: #3A2230; color: var(--pink-2); }
.hero .ladder-cell { padding: 24px 28px; }

/* section tiles */
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.tile { display: flex; flex-direction: column; gap: 14px; padding: 24px; min-height: 240px; text-decoration: none; color: var(--ink); position: relative; overflow: hidden; transition: filter .15s; }
.tile:hover { filter: brightness(.97); }
.tile .kind { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.tile h3 { font-size: 1.7rem; letter-spacing: -0.04em; font-weight: 800; }
.tile p { color: var(--ink-2); max-width: 30ch; }
.tile .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
.tile .glyph { position: absolute; right: -10px; bottom: -34px; font-family: var(--font-display); font-weight: 800; font-size: 9rem; letter-spacing: -0.06em; line-height: 1; opacity: .18; pointer-events: none; }
.tile.t-sage { background: var(--sage-soft); }
.tile.t-sage2 { background: var(--sage-soft); }
.tile.t-sand { background: var(--sand); }
.tile.t-pink { background: var(--pink-1); }
.tile.t-pink2 { background: var(--pink-2); }
.tile.t-pink3 { background: var(--tile-3); }

/* ladder (level path) */
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.ladder > button { background: var(--surface); border: 0; text-align: left; padding: 14px 14px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; }
.ladder > button:hover { background: var(--pink-1); }
.ladder > button.on { background: var(--pink-3); color: #3A2230; }
.ladder > button .n { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ladder > button.on .n { color: #3A2230; opacity: .7; }
.ladder > button .name { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.03em; }
.ladder > button .grade { font-size: .78rem; color: var(--ink-2); }
.ladder > button.on .grade { color: #3A2230; }
.ladder .bar { height: 4px; background: var(--line-soft); width: 100%; margin-top: auto; }
.ladder .bar i { display: block; height: 100%; background: var(--pink-5); }
.ladder > button.on .bar { background: rgba(47,45,31,.15); }

/* page layout */
.pagehead { display: grid; grid-template-columns: 1fr auto; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.pagehead > * { background: var(--surface); }
.pagehead .title { padding: 32px 28px 22px; display: flex; flex-direction: column; gap: 10px; }
.pagehead .title h1 { font-size: clamp(2.4rem, 6vw, 4.6rem); letter-spacing: -0.05em; line-height: .92; }
.pagehead .title p { color: var(--ink-2); max-width: 56ch; }
.pagehead .side { padding: 22px 24px; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 240px; max-width: 380px; }
.pagehead .side.tint { background: var(--pink-1); }
.pagehead .side.pink { background: var(--pink-2); }
.pagehead .side.sage { background: var(--sage-soft); }
.two { display: grid; grid-template-columns: 300px 1fr; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); min-height: 60vh; }
.two > * { background: var(--surface); min-width: 0; }
.list { display: flex; flex-direction: column; }
.list > button { text-align: left; background: var(--surface); border: 0; border-bottom: 1px solid var(--line-soft); padding: 14px 18px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.list > button:hover { background: var(--pink-1); }
.list > button.on { background: var(--pink-2); }
.list > button .t { font-weight: 600; }
.list > button .s { font-size: .8rem; color: var(--ink-2); }
.list > button .check { width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .7rem; }
.list > button .check.done { background: var(--pink-4); border-color: var(--pink-4); color: #3A2230; }
.list .group { padding: 10px 18px 6px; border-bottom: 1px solid var(--line-soft); background: var(--pink-1); }
.content { padding: 28px; display: flex; flex-direction: column; gap: 24px; }
.content > * { max-width: 820px; width: 100%; }
.content .lede { font-size: 1.1rem; color: var(--ink-2); max-width: 60ch; }
.rule { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.rule .r { font-weight: 600; }
.rule .exs { display: flex; flex-direction: column; gap: 6px; }
.rule .ex { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: .95rem; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.rule .ex .es { font-weight: 700; }
.rule .ex .en { color: var(--ink-2); }
.rule .ex .say { border: 0; background: none; cursor: pointer; color: var(--tan-deep); padding: 0; font-size: .95rem; margin-left: 6px; }
table.conj { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.conj th, table.conj td { border: 1px solid var(--line-soft); padding: 8px 10px; text-align: left; }
table.conj th { background: var(--pink-1); font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
table.conj td.es { font-weight: 700; }
.tablewrap { overflow-x: auto; }
.callout { background: var(--pink-1); border-left: 4px solid var(--pink-4); padding: 12px 16px; font-size: .95rem; }
.callout b { font-weight: 600; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.quiz .qhead { padding: 12px 18px; background: var(--pink-1); display: flex; justify-content: space-between; align-items: center; }
.q { padding: 14px 18px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 10px; }
.q .prompt { font-weight: 600; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; cursor: pointer; border-radius: 8px; }
.opts button:hover { background: var(--pink-1); }
.opts button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.opts button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opts button:disabled { cursor: default; }
.q .why { font-size: .88rem; color: var(--ink-2); }
.quiz .qfoot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.score { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }

/* speaking */
.phrases { display: flex; flex-direction: column; }
.phrase { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--line-soft); align-items: center; }
.phrase.on { background: var(--pink-1); }
.phrase.speaking, .dlg .line.speaking { background: var(--pink-2); }
.phrase .es { font-size: 1.35rem; }
.phrase .en { color: var(--ink-2); }
.phrase .hint { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .04em; color: var(--tan-deep); margin-top: 4px; }
.phrase .ctrl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.phrase .result { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.phrase .result .heard { font-size: 1.05rem; }
.meter { height: 8px; background: var(--pink-1); width: 100%; border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pink-5); transition: width .3s; }
.verdict { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
.verdict.good { color: var(--ok); }
.verdict.mid { color: var(--tan-deep); }
.verdict.low { color: var(--bad); }
.notice { padding: 10px 14px; background: var(--pink-1); border-radius: 8px; border: 1px solid var(--line-soft); font-size: .88rem; color: var(--ink-2); }
.notice.warn { background: var(--bad-soft); color: var(--bad); }

/* reading */
.passage { font-size: 1.25rem; line-height: 1.75; max-width: 62ch; }
.passage p { margin-bottom: 1em; }
.passage .w { cursor: pointer; border-bottom: 1px dotted var(--ink-3); padding: 0 1px; border-radius: 2px; transition: background .12s; }
.passage .w:hover { background: var(--pink-1); }
.passage .w.on { background: var(--pink-3); color: #3A2230; border-bottom-color: transparent; }
.passage .sent.speaking { background: var(--pink-1); box-shadow: 0 0 0 4px var(--pink-1); border-radius: 4px; }
.passage .w.known { border-bottom-style: solid; border-bottom-color: var(--pink-4); }
.gloss { position: sticky; top: 72px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.gloss .word { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.03em; }
.gloss .pos { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.gloss .meaning { font-size: 1.05rem; }
.gloss .def { color: var(--ink-2); font-size: .9rem; }
.gloss .exs { font-size: .9rem; border-top: 1px solid var(--line-soft); padding-top: 8px; }
.gloss .exs .en { color: var(--ink-2); }
.readwrap { display: grid; grid-template-columns: 1fr 280px; gap: 1px; background: var(--line); min-height: 100%; }
.readwrap > * { background: var(--surface); min-width: 0; }
.select { font: inherit; font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; width: 100%; }
.translation { background: var(--pink-1); border-radius: var(--radius); padding: 14px 18px; font-size: .95rem; line-height: 1.6; max-width: 62ch; color: var(--ink-2); }
.readside { padding: 24px; display: flex; flex-direction: column; gap: 16px; background: var(--surface-2); }

/* word hunt */
.hunt { display: grid; grid-template-columns: 1fr 340px; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.hunt > * { background: var(--surface); min-width: 0; }
.hunt .board { padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.hunt .board .toolbar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.wgrid { display: grid; gap: 3px; touch-action: none; user-select: none; -webkit-user-select: none; width: min(100%, 560px); aspect-ratio: 1; }
.cell { display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(.9rem, 2.4vw, 1.35rem); background: var(--pink-1); color: var(--ink); border: 0; padding: 0; cursor: pointer; border-radius: 6px; transition: background .12s, transform .12s; aspect-ratio: 1; }
.cell.sel { background: var(--pink-3); color: #3A2230; transform: scale(1.04); }
.cell.found { background: var(--pink-5); color: #3A2230; }
.cell.found.fresh { animation: pop .35s ease-out; }
.cell.nope { animation: shake .3s; }
@keyframes pop { 0% { transform: scale(.7); background: var(--pink-5); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .cell.found.fresh, .cell.nope { animation: none; } .cell.sel { transform: none; } }
.hunt .side { display: flex; flex-direction: column; }
.hunt .side .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wordlist { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.wordlist .wchip { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.wordlist .wchip.found { background: var(--pink-4); border-color: var(--pink-4); color: #3A2230; text-decoration: line-through; text-decoration-thickness: 2px; }
.wordlist .wchip.peek { border-style: dashed; color: var(--ink-3); }
.defcard { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.defcard.empty { color: var(--ink-3); justify-content: center; align-items: center; text-align: center; padding: 40px 20px; }
.defcard .word { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; letter-spacing: -0.04em; line-height: 1; }
.defcard .pos { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.defcard .meaning { font-size: 1.15rem; font-weight: 600; }
.defcard .def { color: var(--ink-2); }
.defcard .exs { border-top: 1px solid var(--line-soft); padding-top: 10px; font-size: .92rem; display: flex; flex-direction: column; gap: 3px; }
.defcard .exs .en { color: var(--ink-2); }
.defcard.fresh { animation: slidein .3s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .defcard.fresh { animation: none; } }
.hunt .done { padding: 18px; background: var(--pink-3); color: #3A2230; display: flex; flex-direction: column; gap: 10px; }
.hunt .done h3 { font-size: 1.5rem; letter-spacing: -0.04em; }
.learned { padding: 14px 18px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--ink-2); }

/* footer */
.foot { padding: 22px 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.roadmap { padding: 24px 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.roadmap .item { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.roadmap .item b { font-weight: 600; }
.roadmap .item span { font-size: .88rem; color: var(--ink-2); }
.empty-state { padding: 40px 28px; display: flex; flex-direction: column; gap: 12px; max-width: 60ch; }


/* tabs */
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); overflow-x: auto; }
.tabs a { padding: 12px 18px; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--ink-2); border-right: 1px solid var(--line-soft); white-space: nowrap; }
.tabs a.on { background: var(--pink-2); color: var(--pink-ink); }
.tabs a:hover { background: var(--pink-1); color: var(--ink); }

/* player */
.player { display: inline-flex; flex-wrap: wrap; max-width: 100%; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 4px; background: var(--surface); }
.player button { border: 0; background: var(--pink-4); color: #3A2230; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; }
.player button:hover { background: var(--pink-5); }
.player button.ghost { background: transparent; color: var(--ink-2); }
.player button.ghost:hover { background: var(--pink-1); color: var(--ink); }
.player button:disabled { opacity: .4; cursor: default; }
.player .pos { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; color: var(--ink-2); padding: 0 8px 0 4px; min-width: 60px; }
.voicepick { display: flex; flex-direction: column; gap: 6px; }
.voicepick select { width: 100%; }
.voicepick .small { color: var(--ink-3); }

/* home stats + goal */
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.statgrid > div { background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.statgrid .big-stat { font-family: var(--font-display); font-weight: 800; font-size: 2rem; letter-spacing: -0.04em; line-height: 1; }
.statgrid .big-stat small { font-size: 1rem; color: var(--ink-3); font-weight: 600; }
.goalrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.goalrow .ring { width: 64px; height: 64px; }
.goalrow select { font: inherit; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 8px; border-radius: 999px; }
.heart { color: var(--pink-5); }
#footcredit:not(:empty)::before { content: "·"; margin: 0 7px; opacity: .5; }
.foot .rights a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line-soft); }
.foot .rights a:hover { color: var(--ink); border-bottom-color: var(--ink-3); }
/* the rights page: a chip row that jumps, and body text set for reading rather than scanning */
.rchips { gap: 6px; }
.rchips button { font-size: .82rem; padding: 5px 12px; }
.rbody { display: grid; gap: 12px; max-width: 74ch; }
.rbody p { font-size: .96rem; line-height: 1.65; color: var(--ink-2); }
.rbody b { color: var(--ink); }
.rbody code { font-family: var(--font-mono); font-size: .85em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.rlist { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: .96rem; line-height: 1.6; color: var(--ink-2); }
.rsec .hhead { padding-bottom: 4px; }
/* a jumped-to heading must clear the sticky bar, or the chip lands on a hidden title */
.rsec { scroll-margin-top: 72px; }
.rnotice { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--pink-5); margin-bottom: 4px; }
/* the game intro cards reuse the settings segmented control, but only .setcard styled its <small>
   as a second line — outside it the sub-label ran straight into the label ("CORTO10 customers") */
.gcard .seg.wide button { display: grid; gap: 2px; align-content: center; padding: 10px 6px; min-width: 0; overflow: hidden; min-height: 52px; }
.gcard .seg.wide button small { display: block; font-family: var(--font-body); font-size: .66rem; font-weight: 400; letter-spacing: 0; text-transform: none; opacity: .75; }
.gcard .seg.wide { margin-bottom: 2px; }
.gcard .intro .label { margin-top: 6px; }
.rchips { justify-content: flex-start; }
.rchips button { min-height: 40px; }
@media (pointer: coarse) { .rsec { scroll-margin-top: 118px; } }
@media (max-width: 760px) { .rbody p, .rlist { font-size: .95rem; } }
/* the dedication under the Home hero: only in the installed app, where there is no footer to read */
.dedication { display: none; margin-top: 14px; font-size: .85rem; color: var(--ink-3); }
html.standalone .dedication { display: block; }

/* path */
.path-wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.path-wrap > * { background: var(--surface); min-width: 0; }
.path { display: flex; flex-direction: column; padding: 8px 28px 24px; position: relative; }
.path::before { content: ""; position: absolute; left: 47px; top: 20px; bottom: 30px; width: 2px; background: var(--pink-2); }
.node { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 10px 0; text-decoration: none; color: var(--ink); position: relative; }
.node .dot { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--pink-2); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: .7rem; letter-spacing: 0; color: var(--ink-2); position: relative; z-index: 1; }
.node.done .dot { background: var(--pink-4); border-color: var(--pink-4); color: #3A2230; }
.node.current .dot { background: var(--pink-5); border-color: var(--pink-5); color: #3A2230; box-shadow: 0 0 0 6px var(--pink-1); }
.node .t { font-weight: 600; }
.node .s { font-size: .8rem; color: var(--ink-2); }
.node .xp { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.node.current .xp { color: var(--pink-5); }
.node:hover .t { text-decoration: underline; }
.path-side { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; background: var(--pink-1); }

/* review */
.review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.review-grid > * { background: var(--surface); min-width: 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; cursor: pointer; position: relative; }
.card.flipped { background: var(--pink-1); }
.card .cw { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; letter-spacing: -0.04em; line-height: 1; }
.card .cen { font-size: 1.3rem; font-weight: 600; }
.card .cdef { color: var(--ink-2); max-width: 40ch; }
.card .cex { border-top: 1px solid var(--line-soft); padding-top: 8px; font-size: .92rem; }
.card .cex .en { color: var(--ink-2); }
.card .tap { position: absolute; bottom: 12px; font-family: var(--font-mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.boxes { display: flex; gap: 4px; }
.boxes i { flex: 1; height: 6px; border-radius: 999px; background: var(--pink-1); }
.boxes i.on { background: var(--pink-5); }
.weak { display: flex; flex-direction: column; gap: 6px; }
.weak a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-soft); border-radius: 8px; text-decoration: none; }
.weak a:hover { background: var(--pink-1); }

/* dialogues */
.dlg { display: flex; flex-direction: column; }
.dlg .line { display: grid; grid-template-columns: 90px 1fr auto; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--line-soft); align-items: center; }
.dlg .line.you { background: var(--pink-1); }
.dlg .line.speaking { background: var(--pink-2); }
.dlg .who { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.dlg .line.you .who { color: var(--pink-5); }
.dlg .es { font-size: 1.2rem; }
.dlg .en { color: var(--ink-2); font-size: .92rem; }
.dlg .result { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.dlg .head { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); }

/* listen & type */
.listen { padding: 28px; display: flex; flex-direction: column; gap: 16px; max-width: 720px; }
.listen input { font: inherit; font-size: 1.2rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); width: 100%; }
.listen .big-play { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--pink-4); color: #3A2230; font-size: 1.6rem; cursor: pointer; }
.listen .big-play:hover { background: var(--pink-5); }
.listen .reveal { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.03em; }

/* exercises: order + blank */
.order .bank, .order .answer { display: flex; flex-wrap: wrap; gap: 8px; min-height: 46px; padding: 8px; border: 1px dashed var(--line-soft); border-radius: 8px; }
.order .answer { background: var(--pink-1); border-style: solid; border-color: var(--pink-2); }
.order .tileb { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 1rem; }
.order .tileb:hover { background: var(--pink-1); }
.order .tileb.used { visibility: hidden; }
.order.right .answer { border-color: var(--ok); background: var(--ok-soft); }
.order.wrong .answer { border-color: var(--bad); background: var(--bad-soft); }
.blank .sentence { font-size: 1.15rem; }
.blank .slot { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--pink-5); text-align: center; font-weight: 700; padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chips button:hover { background: var(--pink-1); }
.chips button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chips button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chips button:disabled { cursor: default; }
#xpstack { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 60; pointer-events: none; }
.xp-toast { background: var(--pink-5); color: #3A2230; padding: 10px 16px; border-radius: 999px; font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; z-index: 60; box-shadow: var(--shadow); animation: slidein .3s ease-out; }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, 1fr); } .tiles .tile:nth-last-child(-n+2) { grid-column: span 1; } }

/* mascots */
.mascot { display: inline-block; flex: none; line-height: 0; }
.mascot svg { width: 100%; height: 100%; display: block; }
.mascot.float { animation: floaty 4s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .mascot.float { animation: none; } }

/* calmer home */
.home-hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.home-hero > * { background: var(--surface); min-width: 0; }
.home-hero .copy { padding: 72px 48px 56px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.home-hero .copy h1 { font-size: clamp(3.4rem, 8.5vw, 7.5rem); font-weight: 800; letter-spacing: -0.06em; line-height: .9; }
.home-hero .copy .tag { max-width: 40ch; color: var(--ink-2); font-size: 1.1rem; line-height: 1.55; }
.home-hero .copy .why { font-size: .9rem; color: var(--ink-3); max-width: 46ch; }
.home-hero .stage { background: var(--pink-1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 24px; position: relative; overflow: hidden; }
.home-hero .stage .blob { position: absolute; width: 120%; height: 70%; left: -10%; bottom: -22%; background: var(--pink-2); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }

/* =========================== v7: coins, casita, shop, collection, owner =========================== */
.coin { font-family: var(--font-display); color: #C9922F; font-weight: 800; }

}

.xp-toast.coin { background: var(--sand); color: var(--ink); }

/* big celebration card */
.bigtoast {

}
.bigtoast.in { transform: none; opacity: 1; }
.bigtoast b { font-family: var(--font-display); font-size: 1.05rem; }

.bigtoast .pic { flex: 0 0 auto; }
.bigtoast .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; font-size: 1.2rem; color: var(--ink-3); cursor: pointer; line-height: 1; padding: 4px 8px; }
.bigtoast.namebox input { flex: 1 1 140px; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
@media (pointer: coarse) { .bigtoast.namebox input { min-height: 44px; font-size: 16px; } }
.bigtoast .btn-row { margin-top: 10px; gap: 8px; }

/* casita */
.casita { display: grid; grid-template-columns: 1fr 340px; gap: 18px; padding: 22px 48px 30px; border-bottom: 1px solid var(--line); align-items: start; }
.casita .room, .casita .buddybox { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
.roomsvg { width: 100%; height: auto; display: block; border-radius: 16px; margin: 8px 0 12px; border: 1px solid var(--line); }
.casita .buddybox { text-align: center; }
.casita .buddypic { display: flex; justify-content: center; margin: 6px 0 2px; }
.casita .buddybox h2 { font-size: 1.5rem; letter-spacing: -0.03em; }
.casita .buddybox p { margin: 2px 0 10px; }
.stagebar { margin: 10px 0 12px; text-align: left; }
.stagebar .row { margin-bottom: 5px; }
.wearrow { display: grid; gap: 8px; text-align: left; }
.wear { display: grid; gap: 4px; }
.wear select { width: 100%; }

.chests { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chest { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: var(--sand); border: 1px solid var(--line); }

.castgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.castcard { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 16px 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }

.castcard .pic { min-height: 118px; display: flex; align-items: center; }
.castcard .lockpic { font-family: var(--font-display); font-size: 3.4rem; color: var(--ink-3); opacity: .4; }
.castcard .meter.sm { width: 100%; height: 6px; }
.castcard .stages { display: flex; gap: 5px; margin-top: 4px; }
.castcard .stages span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: .6rem; background: var(--line); color: var(--ink-3); }

.buddystrip { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }

.brow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* shop + collection */
.tabs { display: flex; gap: 8px; padding: 14px 48px 0; border-bottom: 1px solid var(--line); }

#shopWrap .shopgrid, .page > .shopgrid { padding: 20px 48px 40px; }
.shopcard { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; padding: 14px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.shopcard.owned { background: var(--sage-soft); }
.shopcard b { font-size: .95rem; }
.shopcard .thumb { display: flex; align-items: center; justify-content: center; min-height: 104px; }
.shopcard .thumb.wide { min-height: 0; width: 100%; }

/* owner */
.cpill { display: inline-block; padding: 5px 11px; border-radius: 999px; font-family: var(--font-mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; background: var(--sand); color: var(--ink-2); border: 1px solid var(--line); }

.cpill.go { background: var(--pink-2); color: var(--pink-ink); }
.cpill.bad { background: #F6D4D4; color: #7A2230; }
.ocard { border-bottom: 1px solid var(--line); padding: 24px 48px 28px; }
.ohead { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.ohead .who { display: flex; align-items: center; gap: 12px; }

.ogrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }

.orecent summary { cursor: pointer; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 8px 0; }
.orecent ul { list-style: none; margin-top: 6px; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.orecent li { padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: .85rem; }
.orecent li:last-child { border-bottom: 0; }

/* setup forms */
.setupform { display: grid; gap: 12px; max-width: 680px; }
.setupform.narrow { max-width: 420px; margin: 22px 48px; }
.setupform label { display: grid; gap: 5px; min-width: 0; }

/* =========================== v8: verb trainer, translation, checkpoints, causes =========================== */
.causenote { display: block; margin-top: 8px; padding: 9px 12px; border-radius: 12px; background: var(--sand); border-left: 3px solid var(--pink-4); font-size: .84rem; line-height: 1.5; color: var(--ink-2); }
.causenote b { color: var(--ink); display: block; font-size: .8rem; }
.causeboard { margin-top: 18px; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; background: var(--surface); }
.causerow { border-bottom: 1px solid var(--line); }
.causerow:last-child { border-bottom: 0; }
.causerow summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; font-size: .9rem; }
.causerow p { padding-bottom: 8px; color: var(--ink-2); }

/* verb trainer */
.vctrl { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin: 12px 0; }
.vctrl label { display: grid; gap: 4px; min-width: 0; }
.vctrl select { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 9px 15px; cursor: pointer; font-family: var(--font-mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.seg button.on { background: var(--pink-3); color: var(--pink-ink); }
.notice.tint .mono { text-transform: none; letter-spacing: 0; font-size: .84rem; }
.notice.tint { background: var(--sand); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; font-size: .88rem; line-height: 1.5; }
.vdrill { margin-top: 14px; border: 1px solid var(--line); border-radius: 20px; padding: 20px; background: var(--surface); }
.vq { text-align: center; padding-bottom: 12px; }
.vinf { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: -0.04em; line-height: 1.1; }
.vinf .muted { display: block; font-family: var(--font-body); font-size: .9rem; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.vperson { margin-top: 10px; font-size: 1.15rem; font-weight: 600; }
.vperson .muted { display: block; }
.vin { display: flex; gap: 8px; margin-top: 6px; }
.vin input { flex: 1 1 auto; min-width: 0; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 1.15rem; text-align: center; }
.vhint { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.vres { margin-top: 14px; border-radius: 16px; padding: 14px; background: var(--sand); }
.vres.good { background: var(--ok-soft); }
.vres.bad { background: var(--bad-soft); }
.vres b { font-family: var(--font-display); font-size: 1.1rem; }
.vans { font-size: 1.3rem; margin: 6px 0; }
.vans b { font-family: var(--font-body); font-weight: 700; }
.vtables { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-top: 14px; }
.vtable { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; background: var(--surface); }
.vth { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.vth b { font-family: var(--font-display); font-size: 1.1rem; }
.vth .btn { margin-left: auto; }
.vtable table { width: 100%; border-collapse: collapse; }
.vtable td { padding: 4px 0; font-size: .92rem; vertical-align: baseline; }
.vtable td.p { color: var(--ink-3); font-size: .78rem; white-space: nowrap; padding-right: 8px; }
.vtable td.f { font-weight: 600; text-align: right; }
.vtable td.f.odd { color: var(--pink-5); }
.vtable td.f.odd::after { content: ' •'; color: var(--pink-4); }

/* typed translation */
.tdrill { margin-top: 14px; border: 1px solid var(--line); border-radius: 20px; padding: 20px; background: var(--surface); }
.tprompt { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.3; letter-spacing: -0.02em; margin: 6px 0 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tdrill textarea { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 1.05rem; resize: vertical; }
.tres { margin-top: 14px; border-radius: 16px; padding: 14px; background: var(--sand); }
.tres.good { background: var(--ok-soft); }
.tres.mid { background: var(--sand); }
.tres.bad { background: var(--bad-soft); }
.tres b { font-family: var(--font-display); font-size: 1.1rem; }
.tmarks { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tm { padding: 4px 9px; border-radius: 999px; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); }
.tm.ok { background: var(--ok-soft); border-color: var(--sage); }
.tm.acc { background: var(--sand); border-color: var(--tan); text-decoration: underline dotted; }
.tm.bad { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; }

.tanswer { margin-top: 8px; }
.tanswer .es { font-size: 1.15rem; font-weight: 600; }

/* checkpoints */
.checkpoint { padding: 20px 48px 44px; }
.checkpoint .quiz { display: grid; gap: 12px; }
.cpq { position: relative; }
.cpq .lvtag { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: .58rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.cpin { width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 1.02rem; }
.cpresult { display: flex; gap: 18px; align-items: center; margin-top: 20px; border-radius: 20px; padding: 20px; background: var(--sand); border: 1px solid var(--line); }

.cpresult b { font-family: var(--font-display); font-size: 1.15rem; }
.cpbanner { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; background: var(--pink-1); border: 1px solid var(--pink-3); text-decoration: none; color: var(--ink); }
.cpbanner .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--pink-4); color: var(--pink-ink); font-weight: 800; flex: 0 0 auto; }
.cpbanner .arr { margin-left: auto; }
.cpbanner b { font-family: var(--font-display); }
.levelrow button.locked { opacity: .55; }

@media (max-width: 1100px) { .checkpoint { padding-left: 32px; padding-right: 32px; } }
@media (max-width: 760px) {
  .checkpoint { padding: 14px 18px 34px; }

  .vctrl .seg { justify-self: start; }
  .vinf { font-size: 1.8rem; }
  .tprompt { font-size: 1.25rem; }
  .cpresult { flex-direction: column; align-items: flex-start; gap: 10px; }

  .vtables { grid-template-columns: 1fr; }

@media (pointer: coarse) {
  .vin input, .cpin, .tdrill textarea, .vctrl select { min-height: 44px; font-size: 16px !important; }
  .seg button { min-height: 44px; }
  .causerow summary { min-height: 44px; align-items: center; }

/* =========================== v9: select-then-check, reset, swatches, bag, checkout =========================== */
.opts button.sel, .chips button.sel { background: var(--pink-2); border-color: var(--pink-5); color: var(--pink-ink); box-shadow: inset 0 0 0 1px var(--pink-5); }
.qact { display: flex; gap: 8px; margin-top: 10px; }
.qact .btn:disabled { opacity: .45; cursor: default; }
.cprow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.cprow .cpin { margin-top: 0; flex: 1 1 auto; min-width: 0; }
.cprow .cpreset { flex: 0 0 auto; min-width: 40px; }

/* colour swatches on a shop card */
.swatches { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 2px 0 4px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--swb); background: var(--sw); cursor: pointer; padding: 0; position: relative; }
.sw.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw.have::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; font-size: .6rem; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6); }
.shopcard.fam .btn { margin-top: 2px; }
.shopcard .btn { max-width: 100%; white-space: normal; text-align: center; line-height: 1.3; }

/* the bag bar */
.bagbar { position: sticky; bottom: 12px; margin: 16px 48px 24px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 5; }
.bagbar.has { background: var(--pink-1); border-color: var(--pink-3); }
.bagbar .bagic { font-size: 1.5rem; line-height: 1; }
.bagbar .bagtxt { flex: 1 1 auto; min-width: 0; line-height: 1.35; }
.bagbar .btn { flex: 0 0 auto; }

/* checkout */
.checkout { padding: 20px 48px 44px; display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }
.bagitems { display: grid; gap: 10px; }
.bagline { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.bagline .bthumb { display: grid; place-items: center; width: 80px; }
.bagline .bname { min-width: 0; }
.bagline .bname b { display: block; }
.bagline .bprice { font-family: var(--font-mono); font-size: .85rem; white-space: nowrap; }
.bagsum { position: sticky; top: 72px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
.bagsum .row.between { padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.bagsum .row.short b { color: var(--bad); }
.bagsum .btn-row { margin-top: 6px; }
.bagempty { grid-column: 1 / -1; text-align: center; padding: 30px 20px; display: grid; justify-items: center; gap: 8px; }
.bagempty h2 { font-size: 1.6rem; letter-spacing: -0.03em; }
.bagempty p { max-width: 46ch; }
.receipt { grid-column: 1 / -1; display: grid; gap: 16px; background: var(--ok-soft); border: 1px solid var(--sage); border-radius: 22px; padding: 22px; }
.receipt .rhead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.receipt h2 { font-size: 2rem; letter-spacing: -0.04em; }
.receipt .rlines { display: grid; gap: 8px; }
.receipt .bagline { grid-template-columns: auto 1fr auto auto; }

@media (max-width: 1100px) { .checkout { grid-template-columns: 1fr; padding-left: 32px; padding-right: 32px; } .bagsum { position: static; } .bagbar { margin-left: 32px; margin-right: 32px; } }
@media (max-width: 760px) {
  .checkout { padding: 14px 18px 34px; }
  .bagbar { margin: 12px 18px 18px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; gap: 10px; }
  .bagline { grid-template-columns: auto 1fr; }
  .bagline .bprice { grid-column: 2; }
  .bagline .btn { grid-column: 2; justify-self: start; }
  .receipt .bagline { grid-template-columns: auto 1fr; }
  .receipt .bagline .pill { grid-column: 2; justify-self: start; }
  .qact { flex-wrap: wrap; }
}
@media (pointer: coarse) {
  .sw { width: 30px; height: 30px; }
  .cprow .cpreset { min-height: 44px; }
}

/* =========================== v10: APP MODE — phones and iPad (≤1100px) =========================== */
/* Tuned for iPhone 13 (390), iPhone 17 Pro Max (440) and the 2025 iPad (820 portrait). Later rules win. */
.topbar .gear { display: none; }
.topbar .goal .streakm { display: none; }
.crumbm { display: none; }
.learnhead { padding: 22px 48px 6px; display: grid; gap: 8px; }
.learnhead h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.04em; line-height: 1.05; }
.learnhead .levelrow { margin-top: 8px; }
.levelrow.big { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; }
.levelrow.big button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; border-radius: 14px; font-size: 1.05rem; font-weight: 700; min-height: 60px; }
.levelrow.big button .ln { font-size: .62rem; font-weight: 500; letter-spacing: .02em; text-transform: none; font-family: var(--font-body); opacity: .8; }
.levelrow.big button i { display: none; }
.levelrow.big button.on { background: var(--pink-4); color: var(--pink-ink); border-color: var(--pink-5); }
.learncards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 48px 24px; border-bottom: 1px solid var(--line); }
.learncard { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); }
.learncard.t-pink { background: var(--pink-1); } .learncard.t-pink2 { background: var(--pink-2); color: var(--pink-ink); } .learncard.t-sage { background: var(--sage-soft); }
.learncard b { display: block; font-family: var(--font-display); font-size: 1.2rem; letter-spacing: -0.02em; }
.learncard span:not(.arr) { font-size: .85rem; opacity: .8; }
.learncard .arr { font-size: 1.2rem; }
.settings { padding: 12px 48px 40px; display: grid; gap: 14px; max-width: 720px; }
.settings > * { min-width: 0; }
.setcard { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.setcard .seg.wide { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
.setcard .seg.wide { min-width: 0; }
.setcard .seg.wide button { min-width: 0; overflow: hidden; display: grid; gap: 1px; padding: 10px 6px; font-family: var(--font-body); font-size: .95rem; font-weight: 600; text-transform: none; letter-spacing: 0; min-height: 52px; }
.setcard .seg.wide button small { font-size: .68rem; font-weight: 400; opacity: .75; }
.setrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.setrow input { flex: 1 1 140px; min-width: 0; max-width: 260px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.setcard.links { padding: 6px 16px; gap: 0; }
.setcard.links a { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line-soft); text-decoration: none; color: var(--ink); font-weight: 500; min-height: 48px; }
.setcard.links a:last-child { border-bottom: 0; }

@media (max-width: 1200px) {
  /* --- type: one size up everywhere, iOS-sized controls --- */
  html { font-size: 17px; }
  body { font-size: 1rem; line-height: 1.5; }
  .label, .hsec .hhead .eyebrow, .lcard .foot, .mobnav a, .sidefold > summary, .moretog { font-size: .74rem; }
  .small { font-size: .88rem; }
  .btn { font-size: .88rem; min-height: 48px; padding: 11px 20px; }
  .btn.sm { font-size: .8rem; min-height: 42px; padding: 8px 16px; }
  select, input, textarea, .select { font-size: 17px !important; }
  .opts button { padding: 14px 16px; font-size: 1rem; }
  .chips button, .order .tileb, .wchip { font-size: 1rem; padding: 10px 16px; min-height: 44px; }
  .tabs a { font-size: .8rem; padding: 12px 16px; }
  .pill { font-size: .74rem; }
  .cpill { font-size: .7rem; }
  h1 { letter-spacing: -0.035em; }
  .pagehead .title h1 { font-size: clamp(2.1rem, 7.5vw, 3rem); }
  .pagehead .title p { font-size: 1.02rem; }
  .hsec .hhead h2 { font-size: 1.65rem; }
  .hsec .hhead p { font-size: 1rem; }
  .lcard h3 { font-size: 1.3rem; }
  .lcard p { font-size: .92rem; }
  .rule, .rule p, .passage, .dlg .bubble, .phrase .es, .tip, .cdef { font-size: 1.02rem; }
  .cw { font-size: 1.9rem; }

  /* --- top bar: wordmark · streak · coins · settings. Nothing else. --- */
  .topbar { grid-template-columns: 1fr auto auto auto auto !important; min-height: 60px; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); align-items: center; }
  .topbar > * { border-right: 0 !important; padding: 0 6px; }
  .topbar .lvl, .topbar .crumb, .topbar .cta { display: none !important; }
  .topbar .theme { display: flex !important; padding: 0; margin-left: 2px; }
  .topbar .theme button { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; color: var(--ink-2); }
  .topbar .theme button:active { background: var(--pink-1); }
  .topbar .theme .tlabel { display: none; }
  .topbar .wordmark { font-size: 1.5rem; padding: 0 16px; min-height: 60px; }
  .topbar .goal { display: flex !important; justify-content: center; gap: 6px; padding: 6px 12px 6px 8px; margin: 0 4px; border-radius: 999px; background: var(--pink-1); min-height: 40px; }
  .topbar .goal .ring { width: 26px; height: 26px; }
  .topbar .goal .streak { display: none !important; }
  .topbar .goal .streakm { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-body); font-weight: 700; font-size: .98rem; color: var(--ink); }
  .topbar .goal .streakm .hrt { color: var(--pink-5); }
  .topbar .coins { display: flex; gap: 5px; padding: 6px 12px; margin: 0 4px; border-radius: 999px; background: var(--sand); font-family: var(--font-body); font-size: .98rem; font-weight: 700; min-height: 40px; }
  .topbar .coins .coin { font-size: 1.05rem; }
  .topbar .coins.ready::after { font-size: .95rem; }
  .topbar .gear { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 8px 0 2px; border-radius: 50%; color: var(--ink-2); text-decoration: none; }
  .topbar .gear:active { background: var(--pink-1); }

  /* back row under the bar */
  .crumbm { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: .95rem; }
  .crumbm[hidden] { display: none; }
  .crumbm .back { color: var(--pink-5); text-decoration: none; font-weight: 600; white-space: nowrap; min-height: 32px; display: inline-flex; align-items: center; }
  .crumbm strong { font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- bottom bar: five roomy tabs --- */
  .mobnav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px 0 env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -8px 24px -18px rgba(0,0,0,.5);
  }
  .mobnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 4px 8px; min-height: 64px; text-decoration: none; color: var(--ink-3); font-family: var(--font-body); font-size: .74rem; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .mobnav a .mi { display: grid; place-items: center; width: 52px; height: 32px; border-radius: 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; transition: background .15s; }
  .mobnav a.on { color: var(--pink-5); background: none; }
  .mobnav a.on .mi { background: var(--pink-2); color: var(--pink-ink); }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .xp-toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); right: 12px; left: 12px; text-align: center; }
  #toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important; }
  .bigtoast { right: 10px; left: 10px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: none; }
  .bagbar { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .foot { padding-bottom: 18px; }

  /* --- pages --- */
  .learnhead { padding: 22px 24px 6px; }
  .learncards { padding: 14px 24px 22px; }
  .settings { padding: 12px 24px 40px; }
  .home-hero .copy .btn-row .btn:nth-child(2) { display: none; } /* Word Hunt has its own tab now */
  #app.has-item .pagehead { display: none; }
  #app.has-item .two > .list, #app.has-item .readwrap > .list { border-top: 0; }
}
@media (max-width: 760px) {
  .learncards { grid-template-columns: 1fr; padding: 12px 18px 20px; }
  .learnhead { padding: 18px 18px 4px; }
  .settings { padding: 10px 18px 36px; }
  .levelrow.big { grid-template-columns: repeat(3, 1fr); }
  .home-hero .copy { padding: 26px 18px 22px; }
  .home-hero .copy h1 { font-size: clamp(3rem, 16vw, 4.2rem); }
  .home-hero .stage { padding: 18px 16px 22px; }
  .home-hero .stage .mascot { width: 140px !important; height: 140px !important; }
  .cards5 { grid-template-columns: 1fr 1fr; gap: 10px; }
  .lcard { min-height: 172px; }
  .lcard .mascot { width: 52px !important; height: 52px !important; }
  .stats3 .big-stat { font-size: 1.6rem; }
  .stats3 .label { font-size: .66rem; }
  .vinf { font-size: 2rem; }
}
@media (max-width: 360px) {
  html { font-size: 16px; }
  .setcard .seg.wide button { padding: 8px 2px; font-size: .82rem; min-width: 0; }
  .setcard .seg.wide button small { font-size: .6rem; }
  .levelrow.big button { padding: 8px 2px; min-height: 54px; }
  /* five things in a 320px bar: let the wordmark give way rather than run under the pills */
  .topbar .wordmark { font-size: 1.15rem; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; }
  .topbar .goal, .topbar .coins { padding: 5px 8px; margin: 0 1px; font-size: .86rem; }
  .topbar .gear { margin-right: 2px; width: 40px; height: 40px; }
  .topbar .theme button { width: 40px; height: 40px; }
  .mobnav a { font-size: .68rem; }
  .mobnav a .mi { width: 44px; }
}
@media (pointer: coarse) { .topbar .crumb a { min-height: 44px; display: inline-flex; align-items: center; } }
@media (min-width: 761px) and (max-width: 1200px) {
  /* iPad: more air, still the app chrome */
  .topbar { min-height: 64px; }
  .topbar .wordmark { padding: 0 24px; }
  .topbar .gear { margin-right: 16px; }
  .crumbm { padding: 10px 32px; }
  .mobnav a { min-height: 68px; font-size: .78rem; }
  .mobnav a .mi { width: 64px; height: 34px; }
  .cards5 { grid-template-columns: repeat(3, 1fr); }
  .pagehead { grid-template-columns: 1fr 300px; }
  .home-hero { grid-template-columns: 1.1fr 1fr; }
  .home-hero .stage { padding: 24px 20px; }
  .home-hero .stage .mascot { width: 200px !important; height: 200px !important; }
  .home-hero .copy h1 { font-size: clamp(3.4rem, 9vw, 5rem); }
}

/* =========================== v11: PWA — install, update, offline =========================== */
.installbox { display: grid; gap: 8px; padding: 16px; border-radius: 18px; background: var(--pink-1); border: 1px solid var(--pink-3); position: relative; }
.installbox.done { background: var(--ok-soft); border-color: var(--sage); }
.installbox b { font-family: var(--font-display); font-size: 1.05rem; }
.installbox ol b, .installbox p b { font-family: inherit; font-size: inherit; }
.installbox ol { margin: 6px 0 0 18px; display: grid; gap: 4px; }
.installbox .ic { display: inline-block; padding: 0 5px; border: 1px solid var(--line); border-radius: 5px; font-size: .85em; }
.installbox .btn { justify-self: start; margin-top: 4px; }
.installbox.compact { grid-template-columns: auto 1fr; align-items: center; gap: 14px; padding-right: 44px; }
.installbox .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; font-size: 1.3rem; color: var(--ink-3); cursor: pointer; padding: 6px 10px; min-width: 40px; min-height: 40px; }
.updtoast { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 95; display: flex; align-items: center; gap: 12px; padding: 12px 40px 12px 16px; border-radius: 16px; background: var(--ink); color: var(--inverse-ink); box-shadow: var(--shadow); }
.updtoast span { flex: 1 1 auto; font-weight: 600; }
.updtoast .x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--inverse-ink-2); font-size: 1.3rem; padding: 6px 10px; cursor: pointer; }
@media (min-width: 761px) { .updtoast { left: auto; right: 18px; bottom: 18px; max-width: 420px; } }
#netpill { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--inverse-ink); font-family: var(--font-mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
#netpill[hidden] { display: none; }
/* installed: no browser chrome, so the footer's web links go — but the credit line stays, centred
   and quiet, above the home-screen safe area. It is the one thing worth keeping down there. */
html.standalone .foot { padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); flex-direction: column; align-items: center; text-align: center; gap: 4px; }
html.standalone .foot > span:first-child, html.standalone .foot #footStat { display: none; }
html.standalone .foot .rights { font-size: .92em; opacity: .8; }
html.standalone .foot > span:nth-child(2) { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
html.standalone .foot #footv { opacity: .5; }
html.standalone .foot #footcredit { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: .82rem; color: var(--ink-2); }
html.standalone .foot #footcredit::before { content: none; margin: 0; }
html.standalone .topbar { padding-top: max(env(safe-area-inset-top, 0px), 6px); }

/* =========================== v12: accounts =========================== */
.acct { display: grid; gap: 8px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.acct.in { background: var(--ok-soft); border-color: var(--sage); }
.acct > b { font-family: var(--font-display); font-size: 1.05rem; }
.acct .row.between b { font-family: var(--font-display); font-size: 1.05rem; }
.acctform { display: grid; grid-template-columns: 1fr 140px; gap: 10px; }
.acctform label { display: grid; gap: 4px; min-width: 0; }
.acctform input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.acct.nudge { grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; background: var(--pink-1); border-color: var(--pink-3); }
.acct.nudge .btn { white-space: nowrap; }
.bigtoast.acctbox { align-items: flex-start; }
.bigtoast.acctbox .acct { padding: 0; border: 0; background: none; }
.bigtoast.acctbox .acctform { grid-template-columns: 1fr 110px; }
@media (max-width: 480px) { .acctform { grid-template-columns: 1fr; } .acct.nudge { grid-template-columns: auto 1fr; } .acct.nudge .btn { grid-column: 2; justify-self: start; } .bigtoast.acctbox .acctform { grid-template-columns: 1fr; } }
@media (pointer: coarse) { .acctform input { min-height: 44px; font-size: 16px !important; } }


/* v12.1: owner test mode */
#testbar { position: sticky; top: 56px; z-index: 19; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--ink); color: var(--inverse-ink); font-family: var(--font-mono); font-size: .72rem; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
#testbar span { flex: 1 1 auto; min-width: 0; }
#testbar b { color: var(--pink-3); }
#testbar a { color: inherit; text-decoration: underline; white-space: nowrap; }
#testbar button { border: 1px solid var(--inverse-ink); background: none; color: inherit; border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer; min-height: 32px; }
#testerBox .btn { white-space: normal; text-align: center; line-height: 1.25; }
.acct.test { background: var(--ink); color: var(--inverse-ink); border-color: var(--ink); }
.acct.test .muted, .acct.test a { color: var(--inverse-ink); opacity: .85; }
@media (max-width: 1200px) { #testbar { top: 64px; } }
@media (max-width: 600px) { #testbar { padding: 6px 12px; gap: 8px; font-size: .66rem; } #testbar .long { display: none; } }
html.standalone #testbar { top: calc(64px + max(env(safe-area-inset-top, 0px), 6px)); }

/* v13: evolution, wardrobe, decorating */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; min-height: 36px; }
.chip.on { background: var(--ink); color: var(--inverse-ink); border-color: var(--ink); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink-4); }
.chip.on .dot { background: var(--pink-3); }
.wchips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.wchips::-webkit-scrollbar { display: none; }
.wrail { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

.lotboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.lotcell { position: relative; display: grid; gap: 2px; justify-items: center; align-content: center; aspect-ratio: 1; min-width: 0; padding: 4px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font: inherit; overflow: hidden; }

.gstile { position: absolute; left: 50%; top: 0; transform: translate(-50%, 0); display: grid; gap: 1px; justify-items: center; padding: 10px 16px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); max-width: 90%; }

.cwgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 330px; margin: 0 auto; width: 100%; }

const TIPS = {
  'g1-1': { ojo: 'The letters b and v sound the same in Spanish. "Vaca" and "baca" are pronounced identically.', cultura: 'Mexico has 68 national languages besides Spanish. Words like chocolate, tomate and aguacate come from Nahuatl.' },
  'g1-2': { ojo: 'Words ending in -ción, -sión, -dad and -tad are feminine: la canción, la ciudad. Words ending in -ma from Greek are masculine: el problema, el sistema.', cultura: 'Spanish speakers rarely think about gender consciously — they learn nouns with their article, just like you are doing.' },
  'g1-3': { ojo: 'When the accent is on the last syllable, the plural usually drops it: la canción → las canciones.', cultura: 'Surnames don\'t take a plural: "los García", never "los Garcías".' },
  'g1-4': { ojo: '"Tú" (you, informal) has an accent; "tu" (your) does not. "¿Cómo estás tú?" vs "tu casa".', cultura: 'In Mexico people greet with a kiss on one cheek; in Spain it is two. When in doubt, offer a hand and smile.' },
  'g2-1': { ojo: 'Vosotros is only used in Spain. In Mexico and all Latin America, "ustedes" is both formal and informal "you all".', cultura: 'Mexicans use "usted" with older people and strangers more than Spaniards do. Start with usted; switch when invited: "puedes tutearme".' },
  'g2-2': { ojo: '"Estar muerto" (to be dead) uses estar, even though death is permanent. Think of it as the result of a change.', cultura: '"¿Cómo estás?" asks how you feel today; "¿Cómo eres?" asks what you are like as a person.' },
  'g2-3': { ojo: '"¿Qué?" asks for a definition; "¿Cuál?" asks you to choose: "¿Cuál es tu nombre?" (not qué).', cultura: '"¿Mande?" is the polite Mexican way to say "Pardon?" — literally "command me".' },
  'g2-4': { ojo: 'A few adjectives change meaning before the noun: "un gran hombre" (a great man) vs "un hombre grande" (a big man).', cultura: 'Colours as adjectives agree too, except those that are also nouns: "rosa" and "naranja" stay the same: las camisas rosa.' },
  'g3-1': { ojo: 'Preterite -car / -gar / -zar verbs change spelling in the yo form: busqué, llegué, empecé.', cultura: 'Mexico uses the simple preterite ("comí") where Spain often prefers the present perfect ("he comido") for today.' },
  'g3-2': { ojo: '"Había" (there was / were) is the same form for singular and plural — never "habían" in standard Spanish.', cultura: 'Stories in Spanish start "Había una vez…" — once upon a time.' },
  'g4-1': { ojo: 'The future also expresses probability: "Serán las tres" = it is probably three o\'clock.', cultura: '"Ir a + infinitive" (voy a comer) is far more common in speech than the formal future.' },
  'g4-2': { ojo: 'If the subject is the same in both halves, no subjunctive: "Quiero comer" (not "quiero que coma").', cultura: 'You already know a subjunctive: "¡Que tengas buen día!" and "¡Que aproveche!" are wishes.' },
  'g5-1': { ojo: 'Both -ra and -se forms exist (hablara / hablase). Latin America almost always uses -ra.', cultura: 'Ojalá comes from the Arabic "law sha Allah". Around 4,000 Spanish words come from Arabic: almohada, aceite, azúcar.' },
  'g6-1': { ojo: 'Voseo changes the verb: vos tenés, vos sos, vos querés. The stress moves to the last syllable.', cultura: 'Argentina, Uruguay, Paraguay and much of Central America use vos daily; Mexico does not.' },
};

  { id:'g1-6', title:'Days, months and the date', sub:'Lunes, martes… ¿Qué día es hoy?',
