GRAMMAR[2].push(
  { id:'g2-5', title:'Gustar: saying what you like', sub:'Me gusta el café. Me gustan los gatos.',
    lede:'"Gustar" means "to be pleasing". The thing you like is the subject, so the verb agrees with it — not with you.',
    rules:[
      { r:'Singular thing → gusta. Plural things → gustan.', ex:[['Me gusta el chocolate.','I like chocolate.'],['Me gustan las flores.','I like flowers.'],['Me gusta bailar.','I like dancing (a verb counts as singular).']] },
      { r:'Change the person with me, te, le, nos, les.', ex:[['¿Te gusta la música?','Do you like music?'],['A Ana le gusta leer.','Ana likes reading.'],['Nos gustan los tacos.','We like tacos.']] },
      { r:'Encantar works the same way and means "to love".', ex:[['Me encanta Kamloops.','I love Kamloops.'],['Me encantan los perros.','I love dogs.']] },
    ],
    table:{ h:['','one thing','several things'], rows:[['yo','me gusta','me gustan'],['tú','te gusta','te gustan'],['él / ella / usted','le gusta','le gustan'],['nosotros','nos gusta','nos gustan'],['ellos / ustedes','les gusta','les gustan']] },
    callout:'"Le" is ambiguous (him, her, you), so add "a + name": <b>A Nat le gusta el café.</b>',
    tips:{ ojo: 'Never say "yo gusto" for "I like" — that means "I am pleasing". Always me/te/le.', cultura: 'Answer "¿Te gusta?" with "¡Me encanta!" to sound warm — Mexicans love enthusiasm.' },
    quiz:[ { q:'"I like dogs."', o:['Me gusta los perros.','Me gustan los perros.','Yo gusto perros.','Me gustar perros.'], a:1, why:'Plural subject → gustan.' }, { q:'"We like swimming."', o:['Nos gustan nadar.','Nos gusta nadar.','Gustamos nadar.','Nos gusta nadamos.'], a:1, why:'An infinitive is singular: nos gusta nadar.' }, { q:'"Ana likes coffee."', o:['Ana le gusta el café.','A Ana le gusta el café.','Ana gusta el café.','A Ana gusta café.'], a:1, why:'A + person + le gusta.' } ] },
  { id:'g2-6', title:'Ir a + verb: the near future', sub:'Voy a estudiar. Vamos a comer.',
    lede:'The easiest way to talk about the future: conjugate "ir", add "a", then any verb in the infinitive.',
    rules:[
      { r:'Ir (to go) is irregular.', ex:[['voy, vas, va, vamos, vais, van','I go, you go, he/she goes, we go, you all go, they go']] },
      { r:'Ir a + infinitive = going to.', ex:[['Voy a estudiar esta noche.','I am going to study tonight.'],['¿Vas a venir a la fiesta?','Are you going to come to the party?'],['Vamos a comer tacos.','We are going to eat tacos.']] },
      { r:'Time words for the future.', ex:[['mañana, esta noche, la próxima semana','tomorrow, tonight, next week'],['el año que viene','next year']] },
    ],
    callout:'"¡Vamos!" alone means "Let\'s go!" — and "vamos a…" can mean "let\'s…": <b>Vamos a bailar</b> = let\'s dance.',
    tips:{ ojo: 'Ir a + place needs the article: "voy a la playa", and a + el contracts to al: "voy al mercado".', cultura: '"Ahorita" in Mexico means "right now"… or "in a while"… or "never". Ask when you hear it.' },
    quiz:[ { q:'"She is going to read."', o:['Va a leer.','Va leer.','Vas a leer.','Ir a leer.'], a:0, why:'Va (ella) + a + leer.' }, { q:'"I go to the market."', o:['Voy a el mercado.','Voy al mercado.','Voy mercado.','Va al mercado.'], a:1, why:'A + el = al.' }, { q:'"Let\'s eat!"', o:['¡Vamos a comer!','¡Van a comer!','¡Voy a comer!','¡Comer vamos!'], a:0, why:'Vamos a + verb = let\'s.' } ] },
);
GRAMMAR[3].push(

    rules:[
      { r:'The pronouns: me, te, se, nos, os, se — placed before the verb.', ex:[['Me levanto a las siete.','I get up at seven.'],['¿A qué hora te acuestas?','What time do you go to bed?'],['Ana se ducha por la mañana.','Ana showers in the morning.']] },
      { r:'Common routine verbs.', ex:[['despertarse, levantarse, ducharse','to wake up, get up, shower'],['vestirse, peinarse, lavarse los dientes','to get dressed, comb your hair, brush your teeth'],['acostarse, dormirse','to go to bed, fall asleep']] },

  { id:'g3-4', title:'Commands: directions and instructions', sub:'Gira a la derecha. Sigue todo recto.',
    lede:'To tell someone what to do, use the imperative. The friendly "tú" command is usually just the él/ella form of the present.',
    rules:[
      { r:'Tú commands (affirmative) = the él/ella present form.', ex:[['Habla más despacio.','Speak more slowly.'],['Gira a la izquierda.','Turn left.'],['Sigue todo recto.','Go straight ahead.']] },
      { r:'Eight irregular tú commands worth memorizing.', ex:[['di, haz, ve, pon','say, do/make, go, put'],['sal, sé, ten, ven','leave, be, have, come']] },
      { r:'Usted (polite) commands use the subjunctive form.', ex:[['Hable más despacio, por favor.','Speak more slowly, please.'],['Siga todo recto.','Go straight ahead.'],['Tome la segunda calle.','Take the second street.']] },

    callout:'Negative tú commands also use the subjunctive: <b>No hables</b>, <b>no vayas</b>, <b>no comas</b>.',

  { id:'g3-5', title:'Por vs. para', sub:'Two words for "for" — and each means much more.',

      { r:'PARA: purpose, destination, recipient, deadline, opinion.', ex:[['Estudio para aprender.','I study in order to learn.'],['Este regalo es para ti.','This gift is for you.'],['Salgo para México el lunes.','I leave for Mexico on Monday.'],['La tarea es para mañana.','The homework is due tomorrow.']] },

GRAMMAR[4].push(
  { id:'g4-3', title:'The present perfect: he comido', sub:'Haber + past participle.',
    lede:'"He comido" = I have eaten. Build it with the present of haber plus a participle (-ado / -ido). Spain uses it for today; Mexico prefers the preterite but you will read it everywhere.',
    rules:[
      { r:'Haber in the present: he, has, ha, hemos, habéis, han.', ex:[['He terminado la tarea.','I have finished the homework.'],['¿Has estado en México?','Have you been to Mexico?'],['Hemos aprendido mucho.','We have learned a lot.']] },
      { r:'Irregular participles.', ex:[['hacer → hecho, decir → dicho','done, said'],['ver → visto, escribir → escrito','seen, written'],['abrir → abierto, poner → puesto, volver → vuelto','opened, put, returned']] },
    ],
    callout:'"Todavía no" + perfect = not yet: <b>Todavía no he comido.</b> "Ya" = already: <b>Ya he comido.</b>',
    tips:{ ojo: 'Nothing goes between haber and the participle: "he siempre comido" is wrong — "siempre he comido".', cultura: 'In Mexico "¿Ya comiste?" (did you eat yet?) is a greeting as much as a question — food is care.' },
    quiz:[ { q:'"Have you seen the film?"', o:['¿Has visto la película?','¿Has veído la película?','¿Ha visto la película?','¿Has ver la película?'], a:0, why:'Ver → visto.' }, { q:'"We have written a letter."', o:['Hemos escribido una carta.','Hemos escrito una carta.','Han escrito una carta.','Habemos escrito una carta.'], a:1, why:'Escribir → escrito.' } ] },
  { id:'g4-4', title:'Relative clauses: que, quien, donde', sub:'La chica que canta. El pueblo donde nací.',
    lede:'Relative words glue two sentences together. "Que" does most of the work in Spanish.',
    rules:[
      { r:'"Que" for people and things (who, which, that). It can never be dropped.', ex:[['El libro que leo es de Borges.','The book (that) I am reading is by Borges.'],['La mujer que canta es mi tía.','The woman who sings is my aunt.']] },
      { r:'"Quien(es)" after a preposition for people; "donde" for places; "lo que" for "what".', ex:[['La amiga con quien viajo','The friend I travel with'],['El pueblo donde nací','The town where I was born'],['No entiendo lo que dices.','I don\'t understand what you are saying.']] },
    ],
    callout:'"Cuyo / cuya" = whose, and it agrees with the thing owned: <b>el autor cuya novela leímos</b>.',
    tips:{ ojo: 'After a preposition, things take "el que / la que": "la casa en la que vivo".', cultura: 'Spanish sentences run long — relative clauses let native speakers chain ideas without stopping. Practise reading them aloud.' },
    quiz:[ { q:'"The man who works here"', o:['El hombre quien trabaja aquí','El hombre que trabaja aquí','El hombre donde trabaja aquí','El hombre cual trabaja aquí'], a:1, why:'Subject of the clause → que.' }, { q:'"the city where I live"', o:['la ciudad que vivo','la ciudad donde vivo','la ciudad quien vivo','la ciudad lo que vivo'], a:1, why:'Place → donde.' } ] },
);

  { id:'g5-1', title:'The past subjunctive and if-clauses', sub:'Si tuviera tiempo, viajaría.',

    rules:[
      { r:'Form it from the ellos preterite: drop -ron, add -ra endings.', ex:[['hablaron → hablara, hablaras, hablara, habláramos, hablaran','that I spoke…'],['tuvieron → tuviera; fueron → fuera; hicieron → hiciera','irregulars follow the same rule']] },
      { r:'Si + past subjunctive, conditional.', ex:[['Si tuviera dinero, compraría una casa.','If I had money, I would buy a house.'],['Si fuera tú, hablaría con ella.','If I were you, I would talk to her.']] },

    callout:'"Como si" (as if) always takes the past subjunctive: <b>Habla como si fuera mexicana.</b>',

  { id:'g5-2', title:'Connectors for opinions and arguments', sub:'Sin embargo, además, por lo tanto…',

    rules:[
      { r:'Adding: además, también, asimismo, es más.', ex:[['Es barato; además, es rápido.','It is cheap; moreover, it is fast.']] },
      { r:'Contrasting: sin embargo, no obstante, aunque, en cambio.', ex:[['Es caro; sin embargo, vale la pena.','It is expensive; however, it is worth it.'],['Aunque llueva, iremos.','Even if it rains, we will go.']] },

  { id:'g5-3', title:'Se: impersonal and passive', sub:'Se habla español. Se venden casas.',
    lede:'"Se" lets you say what "one" does or what "is done" without naming anyone. Signs, recipes and news are full of it.',
    rules:[
      { r:'Impersonal se (one / people / you).', ex:[['Aquí se habla español.','Spanish is spoken here / people speak Spanish here.'],['¿Cómo se dice "cat" en español?','How do you say "cat" in Spanish?'],['Se come bien en Oaxaca.','One eats well in Oaxaca.']] },
      { r:'Passive se agrees with the noun.', ex:[['Se vende casa.','House for sale.'],['Se venden tacos.','Tacos sold here.'],['Se necesitan voluntarios.','Volunteers needed.']] },
      { r:'Accidental se — things happen to you.', ex:[['Se me olvidó la llave.','I forgot the key (it forgot itself on me).'],['Se me cayó el vaso.','I dropped the glass.']] },
    ],
    callout:'The accidental "se" is very Mexican and very useful: <b>se me hizo tarde</b> = I ran late (it got late on me).',
    tips:{ ojo: 'With passive se, the verb agrees with the thing: "se venden tacos", not "se vende tacos".', cultura: 'Recipes use se: "se pica la cebolla, se fríe el ajo". Read a Mexican recipe and count the se\'s.' },
    quiz:[ { q:'"How do you say it in Spanish?"', o:['¿Cómo se dice?','¿Cómo dices?','¿Cómo se dicen?','¿Cómo dice?'], a:0, why:'Impersonal se + singular.' }, { q:'"Apartments for rent"', o:['Se renta apartamentos','Se rentan apartamentos','Rentan se apartamentos','Se rentar apartamentos'], a:1, why:'Plural noun → rentan.' } ] },
);
GRAMMAR[6].push(
  { id:'g6-2', title:'Register: tú, usted, vos, vosotros', sub:'Who are you talking to?',
    lede:'Fluency is choosing the right "you". Spanish has four, and the choice says where you are and how close you feel.',
    rules:[
      { r:'Tú — informal singular, everywhere.', ex:[['¿Tú qué piensas?','What do you think?']] },
      { r:'Usted — formal singular; verb like él/ella.', ex:[['¿Usted qué piensa?','What do you (formal) think?'],['Pase usted.','After you.']] },
      { r:'Vos — informal singular in Argentina, Uruguay, Central America; own verb forms.', ex:[['¿Vos qué pensás?','What do you think? (Río de la Plata)'],['Vos sos mi amigo.','You are my friend.']] },
      { r:'Vosotros (Spain) vs ustedes (Latin America) for "you all".', ex:[['¿Vosotros qué pensáis?','What do you all think? (Spain)'],['¿Ustedes qué piensan?','What do you all think? (Mexico)']] },
    ],
    callout:'In Mexico: usted for elders, bosses, strangers and anyone you want to show respect; tú for friends, family, classmates. Children often address grandparents with usted.',
    tips:{ ojo: 'Mixing registers in one sentence ("¿Usted tienes…?") sounds odd. Pick one and keep the verb consistent.', cultura: 'Mexican Spanish loves diminutives as softeners — "ahorita", "un cafecito", "mi amorcito". They signal affection, not size.' },
    quiz:[ { q:'You meet your partner\'s grandmother in Mexico. You say:', o:['¿Tú cómo estás?','¿Usted cómo está?','¿Vos cómo estás?','¿Vosotros cómo estáis?'], a:1, why:'Elder + respect → usted.' }, { q:'"Vos sos" is the vos form of…', o:['ser','estar','saber','salir'], a:0, why:'Vos sos = you are (ser).' } ] },
  { id:'g6-3', title:'Idioms and fillers of everyday Mexican Spanish', sub:'Órale, ándale, no manches, ¿qué onda?',
    lede:'Fluent speakers glue talk together with fillers and colour it with idioms. These are the ones you will hear on day one in Mexico.',
    rules:[
      { r:'Greetings and reactions.', ex:[['¿Qué onda?','What\'s up?'],['¡Órale!','Wow! / OK! / Let\'s go! (depends on tone)'],['¡No manches!','No way! (mild)'],['¡Qué padre!','How cool!']] },
      { r:'Fillers that buy time.', ex:[['pues…','well…'],['o sea','I mean / that is'],['este…','um…'],['bueno','well / OK']] },
      { r:'Idioms with body and food.', ex:[['echar la mano','to lend a hand'],['estar hasta las narices','to be fed up'],['ser pan comido','to be a piece of cake'],['no tener pelos en la lengua','to speak bluntly']] },
    ],
    callout:'"Ahorita" can mean now, soon, or never. "Mande" means "pardon?". "Provecho" is said to anyone eating, even strangers.',
    tips:{ ojo: 'Fillers are for speaking, not writing. In an essay, "o sea" and "este" disappear.', cultura: 'Mexican humour runs on double meanings ("albures"). If everyone laughs and you didn\'t get it, that\'s probably why.' },
    quiz:[ { q:'"¿Qué onda?" means…', o:['What wave?','What\'s up?','Where are you?','How much?'], a:1, why:'Casual greeting.' }, { q:'"Es pan comido" means…', o:['It is eaten bread','It is a piece of cake','It is expensive','It is old'], a:1, why:'Idiom for "easy".' } ] },
);

READING[1].push({ id:'r1-3', title:'Mi día', words:70,
  text:['Me levanto a las siete. Desayuno cereal con leche y una manzana.','Voy a la escuela en autobús con mis amigos. En la escuela tengo clase de español y de arte.','En el recreo jugamos al fútbol. Después de la escuela, hago la tarea en la mesa de la cocina.','Ceno con mi familia a las siete y duermo a las nueve. ¡Buenas noches!'],
  en:'I get up at seven. I have cereal with milk and an apple for breakfast. I go to school by bus with my friends. At school I have Spanish and art class. At break we play football. After school, I do homework at the kitchen table. I have dinner with my family at seven and sleep at nine. Good night!',
  qs:[ { q:'How does the narrator get to school?', o:['On foot','By bus','By car'], a:1 }, { q:'What do they do at break?', o:['Eat lunch','Play football','Read'], a:1 }, { q:'What time do they sleep?', o:['Seven','Eight','Nine'], a:2 } ] });
READING[2].push({ id:'r2-2', title:'Mi casa', words:90,
  text:['Vivo en una casa pequeña pero bonita. Tiene una sala, una cocina, dos cuartos y un baño.','En la sala hay un sofá verde y una televisión. Mi familia ve películas los viernes.','Mi cuarto es mi lugar favorito. Las cortinas son rosas y en la mesa hay muchos libros. Me gusta leer en mi cama.','La cocina es pequeña, pero mi padre cocina muy bien. Los domingos hace tortillas.','Detrás de la casa hay un jardín con flores y un árbol grande. Mi gato duerme a la sombra del árbol.'],
  en:'I live in a small but pretty house. It has a living room, a kitchen, two bedrooms and a bathroom. In the living room there is a green sofa and a television. My family watches films on Fridays. My room is my favourite place. The curtains are pink and on the table there are many books. I like reading in my bed. The kitchen is small, but my father cooks very well. On Sundays he makes tortillas. Behind the house there is a garden with flowers and a big tree. My cat sleeps in the shade of the tree.',
  qs:[ { q:'What colour is the sofa?', o:['Pink','Green','White'], a:1 }, { q:'What does the father make on Sundays?', o:['Soup','Tortillas','Bread'], a:1 }, { q:'Where does the cat sleep?', o:['On the sofa','In the bedroom','Under the tree'], a:2 } ] });
READING[3].push({ id:'r3-2', title:'El clima en Kamloops', words:105,
  text:['Kamloops tiene un clima seco, casi de desierto. En verano hace mucho calor: a veces llegamos a treinta y cinco grados.','El invierno es frío, pero no tanto como en otras partes de Canadá. Nieva en enero y la gente va a esquiar a las montañas.','La primavera es corta y el otoño es muy bonito: las colinas cambian de verde a amarillo.','Ayer llovió por la mañana, pero por la tarde salió el sol. Caminé por el río Thompson y vi muchos pájaros.','Mi estación favorita es el otoño porque no hace ni frío ni calor.'],
  en:'Kamloops has a dry, almost desert climate. In summer it is very hot: sometimes we reach thirty-five degrees. Winter is cold, but not as much as in other parts of Canada. It snows in January and people go skiing in the mountains. Spring is short and autumn is very beautiful: the hills change from green to yellow. Yesterday it rained in the morning, but in the afternoon the sun came out. I walked along the Thompson River and saw many birds. My favourite season is autumn because it is neither cold nor hot.',
  qs:[ { q:'What is the climate of Kamloops like?', o:['Rainy','Dry','Tropical'], a:1 }, { q:'When does it snow?', o:['In January','In April','In October'], a:0 }, { q:'Why is autumn the favourite season?', o:['Because of the skiing','Because it is neither cold nor hot','Because it rains'], a:1 } ] });
READING[4].splice(0, 1, { id:'r4-1', title:'Un viaje inesperado', words:120,
  text:['El año pasado decidimos viajar a Oaxaca sin planear nada. Pensábamos que sería un viaje tranquilo, pero el vuelo salió con tres horas de retraso.','Cuando por fin llegamos, ya era de madrugada y no había taxis. Un señor muy amable nos llevó al centro en su camioneta.','Al día siguiente conocimos a una pareja de Guadalajara que nos invitó a comer mole con su familia. Nunca había probado algo tan rico.','Si hubiéramos planeado todo, no habríamos conocido a esa gente. A veces lo mejor de un viaje es lo que no está en el plan.','Ojalá volvamos el año que viene. Espero que el vuelo salga a tiempo.'],
  en:'Last year we decided to travel to Oaxaca without planning anything. We thought it would be a quiet trip, but the flight left three hours late. When we finally arrived it was already the small hours and there were no taxis. A very kind man took us downtown in his pickup. The next day we met a couple from Guadalajara who invited us to eat mole with their family. I had never tasted anything so delicious. If we had planned everything, we wouldn\'t have met those people. Sometimes the best part of a trip is what isn\'t in the plan. I hope we go back next year. I hope the flight leaves on time.',
  qs:[ { q:'How late was the flight?', o:['One hour','Three hours','It was on time'], a:1 }, { q:'Who took them downtown?', o:['A taxi driver','A kind man in a pickup','The couple from Guadalajara'], a:1 }, { q:'"Si hubiéramos planeado todo…" — which mood is this?', o:['Indicative','Past subjunctive','Future'], a:1 } ] });
READING[5].splice(0, 1, { id:'r5-1', title:'¿Vale la pena aprender otro idioma?', words:140,
  text:['Cada vez más personas aprenden un segundo idioma, y no solo por trabajo. Según varios estudios, hablar dos lenguas mejora la memoria y retrasa el envejecimiento del cerebro.','Sin embargo, aprender un idioma exige tiempo y constancia. Muchos empiezan con entusiasmo y abandonan a las pocas semanas.','En mi opinión, el secreto no es el talento, sino el hábito: quince minutos al día valen más que tres horas un domingo.','Además, un idioma no se aprende solo con libros. Es necesario hablar con personas, equivocarse y volver a intentarlo. Aunque al principio dé vergüenza, la práctica real es lo que convierte el conocimiento en fluidez.','En conclusión, sí vale la pena. No creo que exista una mejor inversión que entender a más personas en sus propias palabras.'],
  en:'More and more people are learning a second language, and not only for work. According to several studies, speaking two languages improves memory and delays brain ageing. However, learning a language demands time and consistency. Many begin with enthusiasm and give up after a few weeks. In my opinion, the secret is not talent but habit: fifteen minutes a day are worth more than three hours on a Sunday. Moreover, a language is not learned only with books. You need to talk to people, make mistakes and try again. Even if it is embarrassing at first, real practice is what turns knowledge into fluency. In conclusion, yes, it is worth it. I don\'t think there is a better investment than understanding more people in their own words.',
  qs:[ { q:'According to the text, what is the "secret"?', o:['Talent','Habit','Money'], a:1 }, { q:'Why do many people give up?', o:['It is expensive','It demands time and consistency','Books are boring'], a:1 }, { q:'"No creo que exista…" — why the subjunctive?', o:['It is a question','Doubt after "no creo que"','It is a command'], a:1 } ] });
READING[6].splice(0, 1, { id:'r6-1', title:'La sobremesa', words:150,
  text:['Hay una palabra en español que no existe en inglés: sobremesa. Es el tiempo que pasa después de comer, cuando los platos ya están vacíos y nadie tiene prisa por levantarse.','En México, la comida del domingo puede empezar a las dos y la sobremesa terminar de madrugada. Se habla de política, de amores, de la vecina; se ríe, se discute, se vuelve a servir café.','Los extranjeros a veces se sorprenden. ¿No tienen nada que hacer? Pero no se trata de no hacer nada; se trata de estar. La sobremesa es el lugar donde una familia se cuenta a sí misma.','Quizás por eso, cuando alguien dice "ya me voy", siempre hay una voz que responde: "quédate tantito". Y uno se queda, porque sabe que lo que se pierde al irse no se recupera al día siguiente.'],
  en:'There is a word in Spanish that does not exist in English: sobremesa. It is the time that passes after eating, when the plates are already empty and nobody is in a hurry to get up. In Mexico, Sunday lunch can start at two and the sobremesa end in the small hours. People talk about politics, about love, about the neighbour; they laugh, they argue, coffee is served again. Foreigners are sometimes surprised. Don\'t they have anything to do? But it is not about doing nothing; it is about being. The sobremesa is the place where a family tells itself its own story. Perhaps that is why, when someone says "I\'m off", there is always a voice that answers: "stay a little". And you stay, because you know that what you lose by leaving is not recovered the next day.',
  qs:[ { q:'What is a sobremesa?', o:['A kind of table','The time spent talking after a meal','A Sunday dessert'], a:1 }, { q:'"Quédate tantito" means…', o:['Leave now','Stay a little','Sit down'], a:1 }, { q:'Which "se" is "se habla de política"?', o:['Reflexive','Impersonal','Accidental'], a:1 } ] });

const PRON_GUIDE = [
  { t:'The five vowels never change', body:'a = "ah" (casa), e = "eh" (mesa), i = "ee" (sí), o = "oh" (oso), u = "oo" (uno). English drifts its vowels; Spanish keeps them short and pure. Say "casa" as CAH-sah, never "cay-sa".', say:'casa, mesa, sí, oso, uno' },
  { t:'Stress: the second-to-last syllable, unless…', body:'Words ending in a vowel, n or s stress the second-to-last syllable (ca-SA, ha-BLAN). Words ending in other consonants stress the last (ha-BLAR, ciu-DAD). A written accent overrides everything (ca-FÉ, MÉ-xi-co).', say:'casa, hablar, ciudad, café, México' },
  { t:'r and rr', body:'A single r between vowels is a quick tap, like the "tt" in American "butter": pero. A double rr (or r at the start of a word) is rolled: perro, rosa. "Pero" (but) and "perro" (dog) differ only here.', say:'pero, perro, rosa, caro, carro' },
  { t:'j and g', body:'j is a breathy h from the back of the throat: jamón, Jalisco. g before e or i sounds the same: gente, girasol. Before a, o, u it is a hard g: gato, gordo.', say:'jamón, gente, gato' },
  { t:'ll and y', body:'Both sound like the y in "yes" in Mexico: llave, yo, calle. Argentina says "sh"; Spain varies. Stick with the Mexican "y".', say:'llave, yo, calle' },

/* small grammar helpers for the word card: article + plural from the part of speech */
function wordExtras(d) {
  const out = [];
  const m = /noun \((m|f)/.exec(d.pos || '');
  if (m && !/\bpl\b/.test(d.pos)) {
    const fem = m[1] === 'f';
    const art = fem && /^a/.test(d.es) && /agua|alma|águila|hacha|hambre/.test(d.es) ? 'el' : (fem ? 'la' : 'el');
    let pl = d.es;
    if (/z$/.test(pl)) pl = pl.replace(/z$/, 'ces');
    else if (/[aeiouáéíóú]$/.test(pl)) pl += 's';
    else if (/ión$/.test(pl)) pl = pl.replace(/ión$/, 'iones');
    else pl += 'es';
    out.push(`${art} ${d.es} · ${fem && art === 'el' ? 'las' : (fem ? 'las' : 'los')} ${pl}`);
  }
  if (d.theme) out.push('theme: ' + d.theme);
  if (d.lvl) out.push('level ' + d.lvl + ' · ' + (LEVELS[d.lvl - 1] || {}).name);
  return out;
}

  { id:'g1-7', title:'Describing things: ser + adjective', sub:'El gato es negro. La casa es grande.',
    lede:'To describe what something is like, use ser and an adjective that agrees with the noun. Colours and sizes are your first adjectives.',
    rules:[
      { r:'Ser + adjective. The adjective matches gender and number.', ex:[['El perro es grande.','The dog is big.'],['La casa es pequeña.','The house is small.'],['Los gatos son negros.','The cats are black.'],['Las flores son bonitas.','The flowers are pretty.']] },
      { r:'Opposites to learn in pairs.', ex:[['grande / pequeño','big / small'],['alto / bajo','tall / short'],['nuevo / viejo','new / old'],['rápido / lento','fast / slow'],['bonito / feo','pretty / ugly']] },
      { r:'"Muy" makes it stronger; "¡Qué…!" makes it an exclamation.', ex:[['Es muy alto.','He is very tall.'],['¡Qué bonito!','How pretty!']] },
    ],
    callout:'Adjectives ending in -e or a consonant (grande, azul, feliz) do not change for gender: <b>el coche grande, la casa grande</b>.',
    tips:{ ojo: 'Some adjectives go before the noun and change meaning: "un gran perro" (a great dog) vs "un perro grande" (a big dog).', cultura: '"Bonito" is the everyday word in Mexico; "lindo" is warmer; "hermoso" is for something truly beautiful.' },
    quiz:[ { q:'"The flowers are red."', o:['Las flores son rojo.','Las flores son rojas.','Las flores es rojas.','Los flores son rojas.'], a:1, why:'Feminine plural: rojas.' }, { q:'Opposite of "rápido":', o:['alto','lento','nuevo','feo'], a:1, why:'Rápido / lento.' }, { q:'"How pretty!"', o:['¡Qué bonito!','¡Muy bonito es!','¡Cómo bonito!','¡Bonito qué!'], a:0, why:'¡Qué + adjective!' } ] },
  { id:'g1-8', title:'Hay: there is, there are', sub:'Hay un gato. Hay tres perros. ¿Hay pan?',
    lede:'One tiny word does the work of two English phrases. "Hay" never changes: one thing or many, question or statement.',
    rules:[
      { r:'Hay + a thing, for singular and plural.', ex:[['Hay un parque cerca.','There is a park nearby.'],['Hay muchos libros en la mesa.','There are many books on the table.'],['No hay leche.','There is no milk.']] },
      { r:'Questions: just raise your voice.', ex:[['¿Hay un baño aquí?','Is there a bathroom here?'],['¿Hay clase mañana?','Is there class tomorrow?']] },
      { r:'Hay vs. está: "hay" introduces something; "está" locates something known.', ex:[['Hay una farmacia en la calle Juárez.','There is a pharmacy on Juárez street.'],['La farmacia está en la calle Juárez.','The pharmacy is on Juárez street.']] },
    ],
    callout:'Never use "el / la" after hay. <b>Hay un gato</b>, not "hay el gato".',
    tips:{ ojo: '"Hay" (there is) sounds exactly like "ay" (ouch) and is written like "ahí" (there) — three different words: hay, ay, ahí.', cultura: '"¿Qué hay?" is a casual "what\'s up?" in Mexico, and "no hay de qué" means "you\'re welcome".' },
    quiz:[ { q:'"There are two cats."', o:['Hay dos gatos.','Hayn dos gatos.','Están dos gatos.','Son dos gatos.'], a:0, why:'Hay for singular and plural.' }, { q:'"There is no water."', o:['No hay agua.','No hay el agua.','No está agua.','No es agua.'], a:0, why:'No hay + noun without article.' }, { q:'"The bank is on the corner." (a known place)', o:['Hay el banco en la esquina.','El banco está en la esquina.','El banco hay en la esquina.','El banco es en la esquina.'], a:1, why:'Locating a known thing → está.' } ] },

GRAMMAR[2].push(
  { id:'g2-7', title:'Stem-changing verbs: quiero, puedo, juego', sub:'The "boot" verbs.',
    lede:'Some verbs change a vowel in the stem in every form except nosotros — drawn on a conjugation table, the changed forms make a boot shape.',
    rules:[
      { r:'e → ie: querer, pensar, entender, empezar, preferir.', ex:[['quiero, quieres, quiere, queremos, quieren','I want, you want, he/she wants, we want, they want'],['Pienso en ti.','I think about you.']] },
      { r:'o → ue: poder, dormir, volver, encontrar, contar.', ex:[['puedo, puedes, puede, podemos, pueden','I can, you can, he/she can, we can, they can'],['Duermo ocho horas.','I sleep eight hours.']] },
      { r:'u → ue: only jugar. e → i: pedir, servir, repetir.', ex:[['juego, juegas, juega, jugamos, juegan','I play…'],['pido, pides, pide, pedimos, piden','I ask for…']] },
    ],
    table:{ h:['','querer (e→ie)','poder (o→ue)','jugar (u→ue)'], rows:[['yo','quiero','puedo','juego'],['tú','quieres','puedes','juegas'],['él / ella','quiere','puede','juega'],['nosotros','queremos','podemos','jugamos'],['ellos','quieren','pueden','juegan']] },
    callout:'Nosotros never changes: <b>queremos, podemos, jugamos</b>. The stress moves off the stem, so the vowel stays.',
    tips:{ ojo: 'The change only happens in the present (and the tú command). In the preterite: quise, pude, jugué.', cultura: '"¿Puedo…?" is the polite opener for anything in Mexico: ¿Puedo pasar? ¿Puedo ver? Add "¿me permite?" for extra courtesy.' },
    quiz:[ { q:'"We want" in Spanish:', o:['quieremos','queremos','quieren','queramos'], a:1, why:'Nosotros keeps the stem: queremos.' }, { q:'"She sleeps":', o:['dorme','duerme','dormí','duermo'], a:1, why:'o → ue: duerme.' }, { q:'"I play":', o:['jugo','juego','jugué','juega'], a:1, why:'u → ue: juego.' } ] },
  { id:'g2-8', title:'Possessives: mi, tu, su', sub:'Mi casa, tus libros, nuestra familia.',
    lede:'Short possessives go before the noun and agree in number. Only nuestro and vuestro also agree in gender.',
    rules:[

      { r:'They agree with the thing owned, not the owner.', ex:[['Mi hermana y mis hermanos','My sister and my brothers'],['Nuestra casa y nuestros perros','Our house and our dogs']] },
      { r:'"Su" is ambiguous; clarify with "de".', ex:[['Su coche → el coche de Ana','Her car → Ana\'s car'],['¿Es tu libro o el de Luis?','Is it your book or Luis\'s?']] },

    callout:'No apostrophe-s in Spanish: <b>el gato de Nat</b> = Nat\'s cat.',
    tips:{ ojo: '"Tu" (your) has no accent; "tú" (you) does. "Mi" (my) has no accent; "mí" (me) does.', cultura: 'Mexicans say "mi amor", "mi vida", "mi cielo" to partners, kids and sometimes customers. Possessives are affectionate.' },
    quiz:[ { q:'"Our house"', o:['nuestro casa','nuestra casa','nuestras casa','nuestros casa'], a:1, why:'Casa is feminine singular: nuestra.' }, { q:'"Ana\'s dog"', o:['el perro de Ana','Ana\'s perro','el Ana perro','la perro de Ana'], a:0, why:'Possession with de.' }, { q:'"my books"', o:['mi libros','mis libros','mí libros','mies libros'], a:1, why:'Plural noun → mis.' } ] },

    lede:'Compare with más/menos + adjective + que; say things are equal with tan + adjective + como. A few adjectives have their own forms.',
    rules:[
      { r:'More / less than.', ex:[['Kamloops es más seco que Vancouver.','Kamloops is drier than Vancouver.'],['El metro es menos caro que el taxi.','The subway is less expensive than the taxi.']] },
      { r:'As … as.', ex:[['Es tan alto como su padre.','He is as tall as his father.'],['Tengo tantos libros como tú.','I have as many books as you.']] },
      { r:'Irregular comparatives.', ex:[['bueno → mejor','good → better'],['malo → peor','bad → worse'],['grande (age) → mayor; pequeño (age) → menor','older / younger']] },
      { r:'Superlatives: el / la más…', ex:[['Es la ciudad más grande de México.','It is the biggest city in Mexico.'],['Es el mejor taco del mundo.','It is the best taco in the world.']] },
    ],
    callout:'Before a number use "de", not "que": <b>más de cien personas</b>.',
    tips:{ ojo: '"Mayor / menor" are for age; "más grande / más pequeño" for size. "Mi hermano mayor" = my older brother.', cultura: 'Mexicans love the superlative suffix -ísimo: buenísimo, riquísimo, guapísimo. It turns "good" into "sooo good".' },
    quiz:[ { q:'"Ana is taller than Luis."', o:['Ana es más alta de Luis.','Ana es más alta que Luis.','Ana es tan alta que Luis.','Ana es alta más que Luis.'], a:1, why:'Más + adjective + que.' }, { q:'"better" in Spanish:', o:['más bueno','mejor','más mejor','bueno'], a:1, why:'Irregular: mejor.' }, { q:'"more than fifty"', o:['más que cincuenta','más de cincuenta','más como cincuenta','mayor cincuenta'], a:1, why:'Before a number: más de.' } ] },
  { id:'g3-7', title:'Direct object pronouns: lo, la, los, las', sub:'¿El libro? Lo leí ayer.',
    lede:'Stop repeating nouns. Once you have mentioned "the book", replace it with "lo" and put it before the verb.',
    rules:[
      { r:'The pronouns: me, te, lo / la, nos, os, los / las — before a conjugated verb.', ex:[['¿Ves la película? Sí, la veo.','Do you see the film? Yes, I see it.'],['¿Tienes las llaves? No las encuentro.','Do you have the keys? I can\'t find them.'],['Te quiero.','I love you.']] },
      { r:'With an infinitive or gerund, attach it to the end (or put it before the first verb).', ex:[['Quiero verla. / La quiero ver.','I want to see it.'],['Estoy leyéndolo. / Lo estoy leyendo.','I am reading it.']] },
      { r:'People as objects take "a" but the pronoun is the same.', ex:[['Veo a Ana. → La veo.','I see Ana. → I see her.'],['Llamo a mis padres. → Los llamo.','I call my parents. → I call them.']] },
    ],
    callout:'"Lo" also stands for a whole idea: <b>¿Sabes que llueve? Sí, lo sé.</b> (I know it.)',
    tips:{ ojo: 'In Mexico "lo" is used for him (never "le" as in parts of Spain): "Lo vi ayer" = I saw him yesterday.', cultura: '"Te lo dije" (I told you so) and "ya lo sé" (I know) are two of the most-heard Mexican sentences.' },
    quiz:[ { q:'"I bought it (the bread)."', o:['Lo compré.','La compré.','Le compré.','Compré lo.'], a:0, why:'Pan is masculine: lo.' }, { q:'"I want to see them (the films)."', o:['Quiero verlas.','Quiero verlos.','Las quiero verlas.','Quiero las ver.'], a:0, why:'Películas → las, attached to the infinitive.' }, { q:'"I call her."', o:['Le llamo.','La llamo.','Lo llamo.','Llamo la.'], a:1, why:'Feminine person → la.' } ] },
);
GRAMMAR[4].push(
  { id:'g4-5', title:'Indirect objects and double pronouns: se lo', sub:'Le di el libro. Se lo di.',
    lede:'"Le / les" mark who receives something. Put a direct pronoun next to it and "le" becomes "se" — Spanish hates two l-pronouns in a row.',
    rules:[
      { r:'Indirect pronouns: me, te, le, nos, os, les.', ex:[['Le escribí a mi abuela.','I wrote to my grandmother.'],['¿Me prestas tu coche?','Will you lend me your car?'],['Les mandé un correo.','I sent them an email.']] },
      { r:'Both pronouns: indirect first, then direct. le/les + lo/la/los/las → se lo…', ex:[['Le di el libro. → Se lo di.','I gave him the book. → I gave it to him.'],['¿Me lo prestas?','Will you lend it to me?'],['Te la mando mañana.','I\'ll send it to you tomorrow.']] },
      { r:'Attached to infinitives and commands.', ex:[['Quiero dártelo.','I want to give it to you.'],['¡Dímelo!','Tell me (it)!']] },
    ],
    callout:'Spanish often doubles the indirect object for clarity: <b>Le di el libro a Ana.</b> The "le" is not optional in speech.',
    tips:{ ojo: 'Accents keep the stress when pronouns attach: dámelo, díselo, cómpramela.', cultura: 'Gustar works with these same pronouns — you already know "me gusta" is "it pleases me". Now "se lo dije" will feel familiar.' },
    quiz:[ { q:'"I gave it (the key) to her."', o:['Le la di.','Se la di.','La le di.','Se le di.'], a:1, why:'le + la → se la.' }, { q:'"Will you lend it (the book) to me?"', o:['¿Me lo prestas?','¿Lo me prestas?','¿Me le prestas?','¿Se lo prestas?'], a:0, why:'me + lo.' } ] },
  { id:'g4-6', title:'The past perfect and reported speech', sub:'Dijo que había llegado tarde.',
    lede:'"Había + participle" = had done. It is the tense of stories and of reporting what people said.',
    rules:[
      { r:'Imperfect of haber + participle.', ex:[['había, habías, había, habíamos, habían','I had, you had…'],['Cuando llegué, ya habían comido.','When I arrived, they had already eaten.'],['Nunca había probado el mole.','I had never tried mole.']] },
      { r:'Reporting: present → imperfect; preterite → past perfect; future → conditional.', ex:[['"Tengo hambre." → Dijo que tenía hambre.','"I\'m hungry." → She said she was hungry.'],['"Llegué tarde." → Dijo que había llegado tarde.','"I arrived late." → He said he had arrived late.'],['"Te llamaré." → Dijo que me llamaría.','"I\'ll call you." → She said she would call me.']] },
    ],
    callout:'"Que" is never dropped after decir: <b>Dijo que…</b>, never "dijo venía".',
    tips:{ ojo: 'Ya (already), todavía no (not yet) and nunca (never) love the past perfect: "todavía no había terminado".', cultura: 'Mexican storytelling leans on "resulta que…" (turns out that…) and "fíjate que…" (get this…) before reported speech.' },
    quiz:[ { q:'"They had already left."', o:['Ya han salido.','Ya habían salido.','Ya salieron.','Ya habrían salido.'], a:1, why:'Habían + salido.' }, { q:'Report: "Estoy cansada." →', o:['Dijo que está cansada.','Dijo que estaba cansada.','Dijo que estuvo cansada.','Dijo estaba cansada.'], a:1, why:'Present → imperfect, with que.' } ] },
);
GRAMMAR[5].push(
  { id:'g5-4', title:'The passive voice and formal writing', sub:'La ley fue aprobada por el congreso.',
    lede:'News and reports use "ser + participle" for the passive. In speech, Spanish prefers "se" or an active sentence — knowing when is a level-5 skill.',
    rules:[
      { r:'Ser + participle (agrees with the subject) + por.', ex:[['La ley fue aprobada por el congreso.','The law was passed by congress.'],['Los premios serán entregados mañana.','The prizes will be handed out tomorrow.']] },
      { r:'In conversation, use se or the active voice instead.', ex:[['Se aprobó la ley.','The law was passed.'],['Aprobaron la ley.','They passed the law.']] },
      { r:'Formal connectors and hedges.', ex:[['cabe destacar que','it is worth noting that'],['según fuentes oficiales','according to official sources'],['al parecer','apparently']] },
    ],
    callout:'"Estar + participle" describes the result, not the action: <b>La puerta está cerrada</b> (it is closed) vs <b>La puerta fue cerrada</b> (it was closed by someone).',
    tips:{ ojo: 'Overusing the passive sounds translated from English. If in doubt, use "se".', cultura: 'Mexican newspapers (El Universal, Reforma, La Jornada) are great level-5 reading; headlines drop articles and use the present for past events.' },
    quiz:[ { q:'"The book was written by a Mexican author."', o:['El libro fue escrito por una autora mexicana.','El libro fue escribido por una autora mexicana.','El libro estuvo escrito por una autora mexicana.','El libro se escribió por una autora mexicana.'], a:0, why:'Ser + participle (escrito) + por.' }, { q:'Most natural in speech: "The restaurant was closed (down)."', o:['El restaurante fue cerrado.','Cerraron el restaurante.','El restaurante ha sido cerrado por ellos.','El restaurante estaba siendo cerrado.'], a:1, why:'Active "they closed it" is what people say.' } ] },
  { id:'g5-5', title:'Diminutives and augmentatives', sub:'Un cafecito, un ratito, una casota.',
    lede:'-ito and -ita make things small, cute or polite; -ote, -ota and -azo make them big or impressive. Mexico runs on diminutives.',
    rules:[
      { r:'-ito / -ita (after consonants -cito / -cita).', ex:[['casa → casita','house → little house'],['café → cafecito','coffee → a nice little coffee'],['ahora → ahorita','now → right now (or soon)'],['momento → momentito','moment → just a sec']] },
      { r:'Used for affection and softening, not only size.', ex:[['¿Me esperas tantito?','Can you wait a tiny bit?'],['Abuelita, mamita, amorcito','Granny, mommy, sweetheart']] },
      { r:'-ote / -ota / -azo for big or intense.', ex:[['casa → casota','house → huge house'],['golpe → golpazo','hit → a big hit'],['¡Qué carrazo!','What a car!']] },
    ],
    callout:'Some diminutives changed meaning: <b>bolsillo</b> (pocket) from bolso, <b>tortilla</b> from torta, <b>señorita</b> (miss).',
    tips:{ ojo: 'Spelling shifts to keep the sound: poco → poquito, chico → chiquito, agua → agüita.', cultura: 'Ordering "un cafecito" or asking for "un favorcito" is not childish in Mexico — it is warm and normal. Spaniards use fewer diminutives.' },
    quiz:[ { q:'Diminutive of "perro":', o:['perrito','perrecito','perrillo','perrote'], a:0, why:'-ito after a consonant-free stem: perrito.' }, { q:'"Ahorita" most often means…', o:['exactly now','soon-ish (context decides)','yesterday','never'], a:1, why:'It softens "now" into "in a bit".' }, { q:'Which suffix makes things big?', o:['-ito','-cita','-ote','-illo'], a:2, why:'-ote / -ota = big.' } ] },
);
GRAMMAR[6].push(
  { id:'g6-4', title:'Reading literature: the long sentence', sub:'Muchos años después, frente al pelotón de fusilamiento…',
    lede:'Literary Spanish stacks clauses, delays the verb and uses tenses you rarely hear on the street. This lesson gives you the tools to read a paragraph of García Márquez.',
    rules:[
      { r:'Find the main verb, then attach the clauses.', ex:[['Muchos años después, frente al pelotón de fusilamiento, el coronel Aureliano Buendía había de recordar aquella tarde remota en que su padre lo llevó a conocer el hielo.','Many years later, in front of the firing squad, Colonel Aureliano Buendía was to remember that distant afternoon when his father took him to discover ice. (Main verb: "había de recordar".)']] },
      { r:'Literary tenses.', ex:[['había de + infinitive','was to / would (destiny)'],['hubo, fue, dijo (preterite for narration)','narrative past'],['-ra forms as pluperfect: "lo que dijera"','what he had said (literary)']] },
      { r:'Pronoun placement in older style.', ex:[['díjole, levantóse','he told him, he got up (archaic attached pronouns)']] },
    ],
    callout:'Read aloud. Spanish prose is written for the ear — the rhythm tells you where the clauses end.',
    tips:{ ojo: '"Aquel / aquella" (that, far away in time) is the literary demonstrative: "aquella tarde remota".', cultura: 'Start with Latin American short stories: Juan Rulfo (Mexico), Borges (Argentina), Cortázar, Isabel Allende. Rulfo\'s "Pedro Páramo" is short, Mexican and unforgettable.' },
    quiz:[ { q:'In the García Márquez sentence, the main verb is…', o:['llevó','había de recordar','conocer','fusilamiento'], a:1, why:'"Había de recordar" — everything else hangs on it.' }, { q:'"Aquella tarde" means…', o:['this afternoon','that (distant) afternoon','every afternoon','tomorrow afternoon'], a:1, why:'Aquel = far in time or space.' } ] },
  { id:'g6-5', title:'Refranes: proverbs everyone knows', sub:'Más vale tarde que nunca.',
    lede:'Fluent speakers quote proverbs half-way and let you finish them. Learn the twelve that come up most, and the grammar hiding inside them.',
    rules:[
      { r:'Time and patience.', ex:[['Más vale tarde que nunca.','Better late than never.'],['No por mucho madrugar amanece más temprano.','Getting up earlier doesn\'t make the sun rise sooner.'],['Camarón que se duerme, se lo lleva la corriente.','You snooze, you lose.']] },
      { r:'People and character.', ex:[['Dime con quién andas y te diré quién eres.','Tell me who you walk with and I\'ll tell you who you are.'],['Perro que ladra no muerde.','A barking dog doesn\'t bite.'],['En boca cerrada no entran moscas.','Flies don\'t enter a closed mouth (silence is safe).']] },
      { r:'Comfort and consequence.', ex:[['No hay mal que por bien no venga.','Every cloud has a silver lining.'],['Ojos que no ven, corazón que no siente.','Out of sight, out of mind.'],['A quien madruga, Dios le ayuda.','The early bird catches the worm.'],['El que ríe al último, ríe mejor.','He who laughs last laughs best.']] },
    ],
    callout:'Notice the grammar inside: "que" clauses, the subjunctive in "que por bien no venga", commands like "dime". Proverbs are tiny grammar lessons.',
    tips:{ ojo: 'Mexicans often say only the first half — "camarón que se duerme…" — and expect you to smile.', cultura: 'Every abuela has a refrán for every situation. Answering one with another is a sign you have arrived.' },
    quiz:[ { q:'"Más vale tarde que ___."', o:['temprano','nunca','ayer','siempre'], a:1, why:'Better late than never.' }, { q:'"Perro que ladra no muerde" means…', o:['Dogs are dangerous','Talkers rarely act','Buy a dog','Don\'t bark'], a:1, why:'A barking dog doesn\'t bite.' } ] },
);

READING[1].push({ id:'r1-4', title:'Los animales de la granja', words:70,
  text:['Mi abuelo tiene una granja. En la granja hay vacas, caballos, gallinas, patos y ovejas.','Las vacas son grandes y dan leche. Las gallinas ponen huevos. Las ovejas son blancas y suaves; dan lana.','El caballo es rápido y el burro es lento. El cerdo es rosa y muy ruidoso.','Mi animal favorito es el pato porque nada en el lago y es pequeño.'],
  en:'My grandfather has a farm. On the farm there are cows, horses, hens, ducks and sheep. The cows are big and give milk. The hens lay eggs. The sheep are white and soft; they give wool. The horse is fast and the donkey is slow. The pig is pink and very noisy. My favourite animal is the duck because it swims in the lake and it is small.',
  qs:[ { q:'What do the hens do?', o:['Give milk','Lay eggs','Give wool'], a:1 }, { q:'Which animal is slow?', o:['The horse','The donkey','The duck'], a:1 }, { q:'Why is the duck the favourite?', o:['It is big','It swims and is small','It is pink'], a:1 } ] });

READING[3].push({ id:'r3-3', title:'Un día en la Ciudad de México', words:115,
  text:['El primer día en la Ciudad de México llegué al Zócalo por la mañana. Es una plaza enorme, con una bandera gigante y la catedral a un lado.','Tomé el metro, que estaba lleno de gente, y caminé por el centro. Había músicos, puestos de comida y edificios de todos los colores.','Comí tacos al pastor en un puesto pequeño. Picaban mucho, pero estaban riquísimos.','Por la tarde entré a un museo y perdí mi cartera. Por suerte, una señora la encontró y me la devolvió.','Volví al hotel cansada, pero feliz. La ciudad es más grande y más amable de lo que pensaba.'],
  en:'On the first day in Mexico City I arrived at the Zócalo in the morning. It is an enormous square, with a giant flag and the cathedral on one side. I took the metro, which was full of people, and walked through the centre. There were musicians, food stalls and buildings of every colour. I ate tacos al pastor at a small stall. They were very spicy, but delicious. In the afternoon I went into a museum and lost my wallet. Luckily, a lady found it and returned it to me. I returned to the hotel tired, but happy. The city is bigger and kinder than I thought.',

READING[4].push({ id:'r4-2', title:'La entrevista', words:120,
  text:['Ayer tuve una entrevista de trabajo. Estaba nerviosa porque nunca había hecho una entrevista en español.','Había preparado mis respuestas la noche anterior. La jefa me preguntó por mis fortalezas y mis debilidades. Le dije que soy organizada, pero que a veces soy perfeccionista.','Ella sonrió y me dijo que me avisarían la próxima semana. Sin embargo, me llamaron hoy por la mañana.','Me ofrecieron el puesto y lo acepté. Empiezo el lunes.','Si no me hubiera preparado, no habría podido responder tan bien. A veces los nervios ayudan.'],
  en:'Yesterday I had a job interview. I was nervous because I had never done an interview in Spanish. I had prepared my answers the night before. The boss asked me about my strengths and weaknesses. I told her that I am organised, but that sometimes I am a perfectionist. She smiled and told me they would let me know next week. However, they called me this morning. They offered me the position and I accepted it. I start on Monday. If I hadn\'t prepared, I wouldn\'t have been able to answer so well. Sometimes nerves help.',

READING[5].push({ id:'r5-2', title:'El teléfono en la mesa', words:135,
  text:['En muchos restaurantes se ve la misma escena: cuatro personas en una mesa y cuatro pantallas encendidas. Nadie habla; todos miran.','Esta tendencia me preocupa. Según los psicólogos, la atención dividida empeora la conversación y, con el tiempo, las relaciones.','Sin embargo, no creo que el teléfono sea el problema en sí. El problema es que no hemos decidido cuándo usarlo.','Por eso propongo una regla sencilla: el teléfono se queda en el bolsillo mientras comemos. Al principio parecerá difícil, pero en pocos días recuperaremos algo que estábamos perdiendo: la conversación.','Además, si alguien lo saca primero, que pague la cuenta. Es cierto que es una broma, pero funciona.'],
  en:'In many restaurants you see the same scene: four people at a table and four screens switched on. Nobody talks; everyone looks. This trend worries me. According to psychologists, divided attention worsens conversation and, over time, relationships. However, I don\'t think the phone is the problem in itself. The problem is that we haven\'t decided when to use it. That is why I propose a simple rule: the phone stays in the pocket while we eat. At first it will seem difficult, but within a few days we will recover something we were losing: conversation. Moreover, if someone takes it out first, let them pay the bill. It is true that it is a joke, but it works.',
  qs:[ { q:'What is the proposed rule?', o:['No phones in restaurants','Phone stays in the pocket while eating','Phones only for photos'], a:1 }, { q:'"No creo que el teléfono sea el problema" — why "sea"?', o:['Command','Subjunctive after "no creo que"','Future tense'], a:1 }, { q:'What does the author say about the joke?', o:['It is cruel','It works','It is old'], a:1 } ] });
READING[6].push({ id:'r6-2', title:'El refranero', words:140,
  text:['Cada idioma guarda su sabiduría en frases cortas que las abuelas repiten y los nietos, al principio, no entienden. En español se llaman refranes.','Sirven para consolar ("no hay mal que por bien no venga"), para regañar ("camarón que se duerme, se lo lleva la corriente") y para dar la razón sin discutir ("más vale tarde que nunca").','Algunos suenan anticuados; otros esconden verdades incómodas. "Ojos que no ven, corazón que no siente" dice, con cierta ternura, que la distancia también cura.','Lo curioso es que casi nunca se dicen completos. Basta con empezar — "a quien madruga…" — y la otra persona, si es de aquí, termina la frase y sonríe.','Aprender refranes no es aprender vocabulario. Es aprender cuándo callar y dejar que hable la corriente.'],
  en:'Every language keeps its wisdom in short phrases that grandmothers repeat and grandchildren, at first, do not understand. In Spanish they are called refranes. They serve to console ("every cloud has a silver lining"), to scold ("the shrimp that falls asleep is carried off by the current") and to concede a point without arguing ("better late than never"). Some sound old-fashioned; others hide uncomfortable truths. "Eyes that don\'t see, heart that doesn\'t feel" says, with a certain tenderness, that distance also heals. The curious thing is that they are almost never said in full. It is enough to begin — "he who rises early…" — and the other person, if they are from here, finishes the sentence and smiles. Learning proverbs is not learning vocabulary. It is learning when to be quiet and let the current speak.',
  qs:[ { q:'What do refranes do, according to the text?', o:['Teach grammar','Console, scold and concede','Replace conversation'], a:1 }, { q:'How are they usually said?', o:['In full, slowly','Only the beginning','In English'], a:1 }, { q:'"Corazón que no siente" — "siente" is from…', o:['sentar','sentir','ser'], a:1 } ] });

/* ----- state helpers (called from part4 once S exists) ----- */
function blankChar(id) { return { care: 0, worn: { head: null, face: null, neck: null, held: null, aura: null } }; }
function initRewards() {
  if (typeof S.coins !== 'number') S.coins = 0;
  if (!S.buddy) S.buddy = 'lola';
  if (!S.chars) S.chars = {};
  CHARS.forEach(c => { if (!S.chars[c.id]) S.chars[c.id] = blankChar(c.id); });
  if (!S.items) S.items = {};
  if (!S.decor) S.decor = {};
  if (!S.room) S.room = { bg: 'casita', on: {} };
  if (!S.room.on) S.room.on = {};
  /* v13: decor lives in spots; older saves only knew "on" */
  if (!S.room.spots) { S.room.spots = {}; Object.keys(S.room.on).filter(k => S.room.on[k]).forEach(k => placeDecor(k)); }
  else Object.keys(S.room.spots).forEach(k => { if (!SPOT_BY_ID[k] || !DECOR_BY_ID[S.room.spots[k]]) delete S.room.spots[k]; });
  if (!S.room.name) S.room.name = '';
  if (!S.chest) S.chest = { daily: null, weekly: 0 };
  if (!S.rewardSeen) S.rewardSeen = {};
  if (!S.cart) S.cart = [];
  /* everyone starts with one free bow so the dressing-up is discoverable */
  if (!S.items['bow-pink']) S.items['bow-pink'] = true;
}

/* ----- the bag: everything is bought through the checkout page ----- */
function priceOf(k, id) {
  if (k === 'item') { const it = ITEM_BY_ID[id]; return it ? itemPrice(it) : 0; }
  if (k === 'decor') { const d = DECOR_BY_ID[id]; return d ? d.price : 0; }
  if (k === 'bg') { const b = ROOM_BG_BY_ID[id]; return b ? b.price : 0; }
  return 0;
}
function ownedOf(k, id) {
  if (k === 'item') return !!S.items[id];
  if (k === 'decor') return !!S.decor[id];
  if (k === 'bg') return id === 'casita' || !!S.decor['bg:' + id];
  return false;
}
function nameOf(k, id) {
  const o = k === 'item' ? ITEM_BY_ID[id] : k === 'decor' ? DECOR_BY_ID[id] : ROOM_BG_BY_ID[id];
  return o ? { es: o.es, en: o.en } : { es: id, en: '' };
}
const inCart = (k, id) => (S.cart || []).some(c => c.k === k && c.id === id);
function cartAdd(k, id) { if (ownedOf(k, id) || inCart(k, id)) return false; S.cart.push({ k, id }); return true; }
function cartRemove(k, id) { S.cart = (S.cart || []).filter(c => !(c.k === k && c.id === id)); }
function cartLines() { return (S.cart || []).filter(c => !ownedOf(c.k, c.id)).map(c => Object.assign({ price: priceOf(c.k, c.id) }, nameOf(c.k, c.id), c)); }
const cartTotal = () => cartLines().reduce((a, l) => a + l.price, 0);
const cartCount = () => cartLines().length;
/* pay for everything in the bag at once; returns the receipt or null if short */
function cartCheckout() {
  const lines = cartLines(); const total = lines.reduce((a, l) => a + l.price, 0);
  if (!lines.length || (S.coins || 0) < total) return null;
  S.coins -= total;
  const b = buddy();
  lines.forEach(l => {
    if (l.k === 'item') { S.items[l.id] = true; const it = ITEM_BY_ID[l.id]; if (it) S.chars[b.id].worn[it.slot] = l.id; }
    else if (l.k === 'decor') { S.decor[l.id] = true; l.spot = placeDecor(l.id); }
    else if (l.k === 'bg') { S.decor['bg:' + l.id] = true; S.room.bg = l.id; }
  });
  S.cart = [];
  return { lines, total, left: S.coins };
}
const charUnlocked = (id) => (S.xp || 0) >= (CHAR_BY_ID[id] ? CHAR_BY_ID[id].unlock : 0);

  const from = STAGE_AT[st - 1], to = STAGE_AT[st];

}
const buddy = () => CHAR_BY_ID[charUnlocked(S.buddy) ? S.buddy : CHARS[0].id];
const ownedItems = () => ITEMS.filter(i => S.items[i.id]);
const itemsFor = (slot) => ITEMS.filter(i => i.slot === slot);

/* called by addXP: every XP is also a coin and also feeds the active companion */
function rewardXP(n) {
  S.coins = (S.coins || 0) + n;
  const b = buddy(); const before = charStage(b.id);
  S.chars[b.id].care = (S.chars[b.id].care || 0) + n;
  const after = charStage(b.id);
  const news = [];
  if (after > before) news.push({ kind: 'stage', char: b.id, stage: after });
  CHARS.forEach(c => { if (c.unlock > 0 && (S.xp || 0) >= c.unlock && !S.rewardSeen['char.' + c.id]) { S.rewardSeen['char.' + c.id] = true; news.push({ kind: 'char', char: c.id }); } });
  return news;
}

/* chests */
function chestReady(which) {
  if (which === 'daily') return xpToday() >= S.goal && S.chest.daily !== todayStr();
  const earned = Math.floor(streakAlive() / 7);
  return earned > (S.chest.weekly || 0);
}
function rollItem(pool) {
  const cand = ITEMS.filter(i => pool.indexOf(i.r) >= 0 && !S.items[i.id]);
  if (!cand.length) return null;
  return cand[Math.floor(Math.random() * cand.length)];
}
function openChest(which) {
  const c = CHESTS[which];
  const coins = c.coins[0] + Math.floor(Math.random() * (c.coins[1] - c.coins[0] + 1));
  S.coins = (S.coins || 0) + coins;
  let item = null;
  if (Math.random() < c.itemChance) { item = rollItem(c.pool); if (item) S.items[item.id] = true; }
  if (which === 'daily') S.chest.daily = todayStr(); else S.chest.weekly = Math.floor(streakAlive() / 7);
  return { coins, item };
}

    const idle = ['an-idle', 'an-idle2', 'an-idle3'][i % 3];
    return `<g transform="translate(${p[0] - 100 * sc} ${p[1] - 100 * sc}) scale(${sc})"><g class="folk ${idle}" style="animation-delay:${-i * 1.1}s">${inner}</g></g>`;
  }).join('');
  return `<svg viewBox="0 0 600 300" class="roomsvg live" role="img" aria-label="${esc(S.room.name || 'Your casita')}">${bg.svg}${props}${folk}</svg>`;
}

/* =========================== LEARNER PROFILE, ACTIVITY LOG, CLOUD SYNC =========================== */
/* Sync is a plain REST call to a Supabase table — no SDK, no external script.
   claude.ai artifacts block outbound fetch, so sync only runs on the hosted (GitHub Pages) copy. */

const CLOUD_KEY = KEY + '.cloud';
const OWNER_KEY = KEY + '.owner';
const TABLE = BRAND.table || 'learner_progress';

/* ----- learner profile ----- */
function newLearnerId() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}
function initProfile() {
  if (!S.who) S.who = { id: newLearnerId(), name: '', since: todayStr() };
  if (!S.who.id) S.who.id = newLearnerId();
  if (!S.act) S.act = [];
  if (!S.time) S.time = {};
  if (!S.pron) S.pron = [];
}
const learnerName = () => (S.who && S.who.name) || 'Learner';

/* ----- activity log (ring buffer, newest last) ----- */
function logAct(k, v, extra) {
  if (!S.act) S.act = [];
  S.act.push(Object.assign({ t: Math.floor(Date.now() / 1000), k, v }, extra || {}));
  if (S.act.length > 240) S.act = S.act.slice(-240);
}
/* ----- time on task: half a minute per 30s tick, only while the tab is visible and recently touched ----- */
let LAST_TOUCH = Date.now();
['pointerdown', 'keydown', 'touchstart', 'hashchange'].forEach(ev => window.addEventListener(ev, () => { LAST_TOUCH = Date.now(); }, { passive: true, capture: true }));
function startClock() {
  setInterval(() => {
    if (document.hidden) return;
    if (Date.now() - LAST_TOUCH > 120000) return;
    const t = todayStr();
    S.time[t] = Math.round(((S.time[t] || 0) + 0.5) * 10) / 10;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }, 30000);
}

/* ----- the summary the owner view reads ----- */
function last30() {
  const out = {};
  for (let i = 29; i >= 0; i--) { const d = addDays(-i); out[d] = S.xpLog[d] || 0; }
  return out;
}
function weakWords() {
  const counts = {};
  (S.mistakes || []).forEach(m => { const t = (m.ex && (m.ex.prompt || m.ex.a || m.ex.q)) || m.lessonId || 'exercise'; counts[t] = (counts[t] || 0) + 1; });
  (S.pron || []).filter(p => p.s < 70).forEach(p => { counts[p.w] = (counts[p.w] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([w, n]) => ({ w, n }));
}
function summary() {
  const pron = S.pron || [];
  const avg = pron.length ? Math.round(pron.reduce((a, p) => a + p.s, 0) / pron.length) : null;
  const mins = Object.values(S.time || {}).reduce((a, b) => a + b, 0);
  const mins7 = Object.entries(S.time || {}).filter(([d]) => d >= addDays(-6)).reduce((a, [, v]) => a + v, 0);
  const b = buddy();
  return {
    id: S.who.id, name: learnerName(), since: S.who.since,
    v: BUILD.v, at: new Date().toISOString(),
    xp: S.xp || 0, coins: S.coins || 0, level: S.level, goal: S.goal,
    xpToday: xpToday(), streak: streakAlive(),
    learned: learnedCount(), lessons: lessonsDone(), lessonsTotal: lessonsTotal(),
    minutes: Math.round(mins), minutes7: Math.round(mins7),
    buddy: b.id, stage: charStage(b.id),
    chars: CHARS.filter(c => charUnlocked(c.id)).map(c => ({ id: c.id, stage: charStage(c.id), care: (S.chars[c.id] || {}).care || 0 })),
    items: Object.keys(S.items || {}).length, itemsTotal: ITEMS.length,
    pronCount: pron.length, pronAvg: avg,
    mistakes: (S.mistakes || []).length,
    weak: weakWords(),
    days: last30(),
    recent: (S.act || []).slice(-30),
  };
}

/* ----- cloud config ----- */
/* The project this build ships with (from the brand file). Empty in a fresh copy: the app then runs on the
   device alone until an owner pastes a URL and key into Owner → Setup. The anon key is public by design. */
const CLOUD_DEFAULT = (BRAND.cloud && BRAND.cloud.url && BRAND.cloud.key) ? { url: BRAND.cloud.url, key: BRAND.cloud.key } : null;
function cloudCfg() { try { return JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null') || CLOUD_DEFAULT; } catch (e) { return CLOUD_DEFAULT; } }
function setCloudCfg(c) { try { c ? localStorage.setItem(CLOUD_KEY, JSON.stringify(c)) : localStorage.removeItem(CLOUD_KEY); } catch (e) {} }
function encodeSetup(c) { try { return btoa(JSON.stringify({ u: c.url, k: c.key })).replace(/=+$/, ''); } catch (e) { return ''; } }
function decodeSetup(code) {
  try {
    const raw = String(code).trim().replace(/\s+/g, '');
    const o = JSON.parse(atob(raw + '==='.slice(0, (4 - raw.length % 4) % 4)));
    if (!o.u || !o.k) return null;
    return { url: String(o.u).replace(/\/+$/, ''), key: String(o.k) };
  } catch (e) { return null; }
}

const Cloud = {
  state: 'off',        /* off | ready | syncing | ok | error | blocked */
  msg: '',
  last: null,
  timer: null,
  lastSent: '',
  on() { return !!cloudCfg(); },
  blocked() { return ON_CLAUDE; },
  head(cfg, extra) {
    return Object.assign({ apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json' }, extra || {});
  },
  setState(s, m) { Cloud.state = s; Cloud.msg = m || ''; document.querySelectorAll('[data-cloudstate]').forEach(el => paintCloudPill(el)); },
  /* upsert this learner's row */
  async push(force) {
    const cfg = cloudCfg(); if (!cfg) return;
    if (S.test) return;                                   /* the owner's test copy never leaves the device */
    if (Cloud.blocked()) { Cloud.setState('blocked', 'Sync is switched off inside claude.ai — use your web address.'); return; }
    const payload = summary(); payload.full = fullState(); payload.acct = !!S.acct;
    const body = { id: rowId(), name: learnerName(), updated_at: new Date().toISOString(), payload };
    const sig = JSON.stringify([body.id, payload.xp, payload.coins, payload.lessons, payload.learned, payload.minutes, body.name, Object.keys(S.items || {}).length, Object.keys(S.done || {}).length]);
    if (!force && sig === Cloud.lastSent) return;
    Cloud.setState('syncing');
    try {
      const r = await fetch(cfg.url + '/rest/v1/' + TABLE, {
        method: 'POST',
        headers: Cloud.head(cfg, { Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify([body]),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 120));
      Cloud.lastSent = sig; Cloud.last = new Date();
      Cloud.setState('ok');
    } catch (e) {
      Cloud.setState('error', String(e.message || e).slice(0, 160));
    }
  },
  queue() {
    if (!Cloud.on() || Cloud.blocked() || S.test) return;
    clearTimeout(Cloud.timer);
    Cloud.timer = setTimeout(() => Cloud.push(false), 6000);
  },
  async all() {
    const cfg = cloudCfg(); if (!cfg) throw new Error('Cloud sync is not set up on this device yet.');
    if (Cloud.blocked()) throw new Error('claude.ai blocks this page from reaching the internet. Open the app from its own web address instead.');
    const r = await fetch(cfg.url + '/rest/v1/' + TABLE + '?select=id,name,updated_at,payload&order=updated_at.desc', { headers: Cloud.head(cfg) });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 160));
    return r.json();
  },
  async get(id) {
    const cfg = cloudCfg(); if (!cfg || Cloud.blocked()) return null;
    const r = await fetch(cfg.url + '/rest/v1/' + TABLE + '?id=eq.' + encodeURIComponent(id) + '&select=id,name,updated_at,payload', { headers: Cloud.head(cfg) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json(); return rows[0] || null;
  },
  async byName(name) {
    const cfg = cloudCfg(); if (!cfg || Cloud.blocked()) return [];
    const r = await fetch(cfg.url + '/rest/v1/' + TABLE + '?name=ilike.' + encodeURIComponent(String(name).trim()) + '&select=id,name,updated_at,payload&order=updated_at.desc', { headers: Cloud.head(cfg) });
    if (!r.ok) return [];
    return r.json();
  },
  async patch(id, payload) {
    const cfg = cloudCfg(); if (!cfg || Cloud.blocked()) return;
    await fetch(cfg.url + '/rest/v1/' + TABLE + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: Cloud.head(cfg, { Prefer: 'return=minimal' }), body: JSON.stringify({ payload }) }).catch(() => {});
  },
  /* on open: if the account's cloud copy is newer and not behind, take it — that is what makes a second device just work */
  async pull() {
    if (!S.acct || S.test || Cloud.blocked() || !Cloud.on()) return false;
    try {
      const row = await Cloud.get(S.acct.id);
      const full = row && row.payload && row.payload.full;
      if (!full) return false;
      if ((full.savedAt || 0) > (S.savedAt || 0) && (full.xp || 0) >= (S.xp || 0)) { adoptState(full); return true; }
    } catch (e) {}
    return false;
  },
};
function paintCloudPill(el) {
  const map = { off: ['Not set up', 'off'], ready: ['Ready', 'off'], syncing: ['Syncing…', 'go'], ok: ['Synced', 'ok'], error: ['Sync problem', 'bad'], blocked: ['Off in claude.ai', 'off'] };
  const [t, cls] = map[Cloud.state] || map.off;
  el.className = 'cpill ' + cls;
  el.textContent = t + (Cloud.state === 'ok' && Cloud.last ? ' · ' + Cloud.last.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '');
  el.title = Cloud.msg || '';
}
function initCloud() {
  if (Cloud.blocked()) { Cloud.state = cloudCfg() ? 'blocked' : 'off'; return; }
  if (cloudCfg()) { Cloud.state = 'ready'; setTimeout(async () => { const took = await Cloud.pull(); if (!took) Cloud.push(true); }, 1200); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) Cloud.push(false); else if (S.acct) Cloud.pull().then(took => { if (took) render(); }); });
  window.addEventListener('pagehide', () => Cloud.push(false));
}

/* ----------------------------------------------------------------------
   ACCOUNTS — a name and a PIN. No email, no verification: the id is a hash of the two,
   so the same name + PIN on any device opens the same progress.
   ---------------------------------------------------------------------- */
const rowId = () => (S.acct && S.acct.id) || S.who.id;
async function acctId(name, pin) {
  const text = BRAND.id + ':' + String(name).trim().toLowerCase() + ':' + String(pin).trim();
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return 'a_' + Array.from(new Uint8Array(buf)).slice(0, 12).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {

/* sign in or create; returns { ok, msg, choice? } — choice means the caller must ask which copy to keep */
async function signIn(name, pin, opts) {
  opts = opts || {};
  name = String(name || '').trim();
  if (name.length < 2) return { ok: false, msg: 'Type your name first.' };
  if (!validPin(pin)) return { ok: false, msg: 'The PIN is 4 to 8 digits.' };
  if (S.test) return { ok: false, msg: 'Leave test mode first — the test copy is never saved to the cloud.' };
  if (!Cloud.on()) return { ok: false, msg: 'Saving across devices needs a cloud project. An owner sets one up once in Owner → Setup; until then progress stays on this device.' };
  if (Cloud.blocked()) return { ok: false, msg: 'Sign-in needs the web address — claude.ai blocks this page from reaching the internet.' };
  const id = await acctId(name, pin);
  let row = null;
  try { row = await Cloud.get(id); } catch (e) { return { ok: false, msg: 'Could not reach the cloud: ' + (e.message || e) }; }
  const localXP = S.xp || 0;
  if (row && row.payload && row.payload.full) {
    const cloudXP = row.payload.full.xp || 0;
    if (localXP > cloudXP && !opts.prefer) return { ok: false, choice: { local: localXP, cloud: cloudXP, name } };
    if (opts.prefer === 'local') { S.acct = { id, name, since: todayStr() }; save(); await Cloud.push(true); return { ok: true, msg: `Signed in as ${name}. This device's progress (${localXP} XP) is now the saved copy.` }; }
    adoptState(row.payload.full);
    S.acct = { id, name, since: (row.payload.full.acct && row.payload.full.acct.since) || todayStr() };
    if (S.who.id && S.who.id !== id) Cloud.patch(S.who.id, { migrated_to: id, name });
    S.who.name = name; save(); Cloud.lastSent = ''; await Cloud.push(true);
    logAct('signin', name);
    return { ok: true, msg: `Welcome back, ${name} — ${S.xp || 0} XP, ${S.coins || 0} ${COIN_NAME} and ${lessonsDone()} lessons restored.`, restored: true };
  }
  /* new account: bring across an older DEVICE record under this name. Account rows are never imported by name — they need the PIN. */
  let legacy = null, sameName = [];
  try { sameName = await Cloud.byName(name); } catch (e) {}
  const isAcct = (r) => /^a_/.test(r.id) || (r.payload && r.payload.acct);
  if (sameName.some(isAcct) && localXP < 30) return { ok: false, msg: `There is already an account called ${name}. If that is you, check the PIN. If you are a different ${name}, add a last initial — “${name} R”, say.` };
  legacy = sameName.filter(r => r.id !== id && !isAcct(r) && r.payload && !r.payload.migrated_to && (r.payload.xp || 0) > 0).sort((a, b) => (b.payload.xp || 0) - (a.payload.xp || 0))[0] || null;
  let imported = '';
  if (legacy && (legacy.payload.xp || 0) > localXP) {
    if (legacy.payload.full) adoptState(legacy.payload.full); else adoptState(rebuildFromSummary(legacy.payload));
    imported = ` We found your earlier record and brought it across: ${S.xp || 0} XP, ${S.coins || 0} ${COIN_NAME}, ${lessonsDone()} lessons, ${learnedCount()} words.`;
    Cloud.patch(legacy.id, Object.assign({}, legacy.payload, { migrated_to: id }));
  }
  if (S.who.id && S.who.id !== id) Cloud.patch(S.who.id, { migrated_to: id, name });
  S.acct = { id, name, since: todayStr() };
  S.who.name = name; save(); Cloud.lastSent = ''; await Cloud.push(true);
  logAct('signup', name);
  const dup = sameName.some(isAcct) ? ` (There was already a ${name} saved with a different PIN — if that was you, sign out and try the other PIN.)` : '';
  return { ok: true, msg: `Saved. From now on, sign in as ${name} with that PIN on any device and your progress follows you.` + imported + dup, restored: !!imported };
}
function signOut() { S.acct = null; save(); }

/* ----- owner passcode -----
   The Owner page shows everyone's progress, so exactly one person should be able to open it. There are
   two locks, and either one is enough:

   1. BRAND.ownerPass — a SHA-256 hash of the owner's passcode, baked into the build. While it is set,
      that passcode is the only way in on every device, the "pick a passcode" screen never appears, and
      no database is needed. This is the real lock; the Owner page prints the line to paste in.
   2. The claim — with a database and no baked hash, the FIRST device to set a passcode registers its
      hash in a reserved row. Every device after that has to match it and can no longer set its own.

   Only the hash is ever stored or sent. Hashing needs a secure context (https, or localhost via the
   Start command); opened as a bare file:// page the browser withholds crypto.subtle, and the gate says
   so rather than letting anyone through. */
const OWNER_ROW = '__owner__';
const bakedOwnerPass = () => String((BRAND && BRAND.ownerPass) || '').trim();
async function ownerHash(pass) {
  const text = BRAND.id + ':owner:' + String(pass);

    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return 'o_' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 40);

  catch (e) { OWNER_CLAIM = undefined; }

}

    out.push({ es: String(es).trim(), en: String(en).trim(), level: level || 1, src });
  };

  Object.entries(DIALOGUES || {}).forEach(([lv, ds]) => (ds || []).forEach(d => (d.lines || []).forEach(l => add(l.es, l.en, Number(lv), 'dialogue'))));

    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  /* reload only when WE asked for the new worker — the first install also fires this and must not bounce the page */
  let reloading = false;

/* =========================== OWNER TEST MODE =========================== */
/* Behind the Owner passcode. Turns THIS device into a test copy with everything unlocked — every level,
   companion, outfit, decoration and room, plus a big pile of quetzalitos — so every screen can be walked
   through. The real progress is stashed first and comes back when you leave. While test mode is on nothing
   is sent to the cloud and sign-in is disabled, so Nat's data and the Owner list are never touched. */

const BLANK_STATE = () => ({ level: 1, done: {}, found: {}, learned: {}, quiz: {}, spoken: {}, xp: 0, xpLog: {}, streak: { count: 0, last: null }, goal: 20, mistakes: [], cards: {}, listen: {} });
const Test = {
  on() { return !!(S && S.test); },
  stashKey() { return KEY + '.real'; },
  hasStash() { try { return !!localStorage.getItem(Test.stashKey()); } catch (e) { return false; } },
  /* replace the live state with a fresh one and run the same init that boot does */
  _fresh() {
    S = BLANK_STATE();
    S.who = { id: 'OWNERTEST', name: 'Owner', since: todayStr(), asked: true };
    initRewards(); initProfile(); initConcepts(); initChecks();
  },
  grantAll() {
    S.xp = 2500;                                   /* past every companion unlock (0 / 300 / 800 / 1600) */
    S.coins = 9999;
    S.placed = LEVELS.length;                      /* every level open, nothing has to be passed first */
    ITEMS.forEach(i => { S.items[i.id] = true; });
    DECOR.forEach(d => { S.decor[d.id] = true; });
    ROOM_BGS.forEach(b => { if (b.id !== 'casita') S.decor['bg:' + b.id] = true; });
    CHARS.forEach(c => { S.chars[c.id].care = STAGE_AT[STAGE_AT.length - 1]; S.rewardSeen['char.' + c.id] = true; });
    S.streak = { count: 7, last: todayStr() };
    S.cart = [];
  },
  enter() {
    if (Test.on()) return;
    try { localStorage.setItem(Test.stashKey(), JSON.stringify(S)); } catch (e) {}
    Test._fresh();
    S.test = { since: Date.now() };
    Test.grantAll();
    logAct('test', 'owner test mode on');
    save();
  },
  /* start the test copy over (still everything unlocked) */
  reset() {
    if (!Test.on()) return;
    Test._fresh();
    S.test = { since: Date.now() };
    Test.grantAll();
    save();
  },
  /* put the real progress back */
  leave() {
    if (!Test.on()) return;
    let real = null;
    try { real = JSON.parse(localStorage.getItem(Test.stashKey()) || 'null'); } catch (e) {}
    try { localStorage.removeItem(Test.stashKey()); } catch (e) {}
    S = Object.assign(BLANK_STATE(), real || {});
    S.streak = Object.assign({ count: 0, last: null }, (real && real.streak) || {});
    delete S.test;
    initRewards(); initProfile(); initConcepts(); initChecks();
    save();
    if (S.acct) Cloud.pull().then(() => render());
  },
  /* quick pokes while testing */
  markAllDone() {
    LEVELS.forEach(l => {
      (GRAMMAR[l.id] || []).forEach(g => { S.done[g.id] = true; S.quiz[g.id] = 100; });
      (DIALOGUES[l.id] || []).forEach(d => { S.done[d.id] = true; });
      (READING[l.id] || []).forEach(r => { S.done[r.id] = true; });
      (HUNTS[l.id] || []).forEach(h => { S.done['h' + l.id + '-' + h.theme] = true; h.words.forEach(w => { S.learned[w] = true; }); });
      S.checks[l.id] = { best: 100, passed: true, at: todayStr() };
    });
    save();
  },
  chestsReady() {
    S.xpLog[todayStr()] = Math.max(S.xpLog[todayStr()] || 0, S.goal || 20);
    S.chest = { daily: null, weekly: 0 };
    S.streak = { count: 14, last: todayStr() };
    save();
  },
};

/* ----- pace -----
   The two timed games (Mercado, ¡El o la!) share one setting. The numbers below are the Normal
   pace; the multiplier stretches or squeezes every clock in both games — the per-item time AND the
   round length, so the number of words you face stays about the same whichever pace you pick.
   Normal is deliberately generous: a fluent speaker should not be rushed, because a learner reading
   a word for the first time needs several times longer than someone who already knows it. */
const GAME_PACE = [['calma', 'Con calma', 'more time', 1.45], ['normal', 'Normal', 'as it comes', 1], ['rapido', 'Rápido', 'a real rush', 0.72]];
function paceKey() { return (S.games && S.games.pace) || 'normal'; }
function paceMul() { const f = GAME_PACE.find(x => x[0] === paceKey()); return f ? f[3] : 1; }
function setPace(k) { if (!S.games) S.games = {}; S.games.pace = k; save(); }

function secsLabel(n) {
  n = Math.round(n);
  if (n < 120) return n + ' seconds';
  const m = Math.floor(n / 60), r = n % 60;
  return r ? `${m} min ${r} s` : `${m} minutes`;
}

let MG = null;   /* the running Mercado game */
function mercadoPick() {
  const seen = new Set(MG.asked);
  const all = mercadoItems();
  let pool = all.filter(i => !seen.has(i.es));
  if (!pool.length) pool = all;
  const item = pool[Math.floor(Math.random() * pool.length)];
  MG.asked.push(item.es);
  const same = shuffle(all.filter(i => i.stall === item.stall && i.es !== item.es)).slice(0, 3);
  const others = shuffle(all.filter(i => i.stall !== item.stall && i.es !== item.es));
  const wrong = same.concat(others).slice(0, 3);
  return { item, options: shuffle([item].concat(wrong)) };
}
